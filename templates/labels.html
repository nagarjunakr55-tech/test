{% extends "base.html" %}
{% block content %}
<h2>Barcode Generator</h2>

<form action="{{ url_for('labels.create') }}" method="post" class="row" style="gap:6px; align-items:flex-end;">
  <input name="brand" placeholder="Brand" required>
  <input name="mrp" placeholder="MRP" inputmode="decimal">
  <input name="bought_price" placeholder="Bought Price" inputmode="decimal">
  <input name="selling_price" placeholder="SP Price" inputmode="decimal">

  <select name="category">
    <option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
  </select>
  <select name="size">
    <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
    <option>28</option><option>30</option><option>32</option><option>34</option><option>36</option><option>38</option><option>40</option><option>42</option>
  </select>

  <input name="copies" type="number" min="1" value="1" style="width:90px;">
  <button type="submit" class="btn-orange">Generate</button>
</form>

<h3 style="margin-top:12px;">Recent</h3>
<div class="table-responsive">
  <table>
    <thead><tr>
      <th>Brand</th><th>MRP</th><th>Bought</th><th>SP</th>
      <th>Size</th><th>Category</th><th>Code</th><th>Preview</th><th>TSPL</th>
    </tr></thead>
    <tbody>
      {% for b,m,bp,sp,s,c,code,created in rows %}
      <tr>
        <td>{{ b }}</td><td>{{ m }}</td><td>{{ bp }}</td><td>{{ sp }}</td>
        <td>{{ s }}</td><td>{{ c }}</td><td><code>{{ code }}</code></td>
        <td><img src="{{ url_for('static', filename='barcodes/' + code + '_' + b + '_180x60.png') }}"
                 alt="barcode" style="height:30px; border:1px solid #eee;"></td>
        <td><a href="{{ url_for('labels.tspl_download', code=code) }}">Download TSPL</a></td>
        <td>
  <a href="{{ url_for('labels.print_png_page', code=code) }}" target="_blank">Print PNG</a>
</td>

      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
