<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Print Label {{ code }}</title>
  <style>
    /* Exact label size: 50.8mm x 25mm, no margins */
    @page { size: 50.8mm 25mm; margin: 0; }
    html, body {
      margin: 0; padding: 0;
      width: 50.8mm; height: 25mm;
      background: #fff;
    }
    .wrap {
      width: 50.8mm; height: 25mm;
      display: flex; align-items: center; justify-content: center;
    }
    img {
      width: 50.8mm; height: 25mm;
      object-fit: contain;  /* keeps aspect; you can try 'cover' if you want full bleed */
      image-rendering: -webkit-optimize-contrast;
    }
    @media print {
      /* hide any controls if you later add them */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="{{ url_for('static', filename=rel_img) }}" alt="barcode">
  </div>
  <script>
    // auto-open print dialog on load (nice on Android and desktop)
    window.addEventListener('load', () => {
      setTimeout(() => window.print(), 200);
    });
  </script>
</body>
</html>
