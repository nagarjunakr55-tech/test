<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DRIP Fashions</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />

  <style>
    nav{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;              
  overflow-x:auto;               
  -webkit-overflow-scrolling:touch;
  white-space:nowrap;
}
nav a{
  color:#fff;
  text-decoration:none;
  padding:6px 8px;               
  border-radius:8px;
  background:rgba(255,255,255,.15);
  flex:0 0 auto;                 
}
nav a:hover{ background:rgba(255,255,255,.25); }
nav .spacer{ flex:1 1 auto; }
/* logout link floats to the right side of nav */
nav a.logout{ background:var(--warn); }
@media (max-width:600px){
  nav{ gap:6px; }
  nav a{ padding:6px 8px; font-size:14px; }
}

    :root{
  --brand:#1f2937;      /* header dark blue */
  --bg:#ffffff;         /* page background */
  --fg:#111827;         /* default text color */
  --border:#e5e7eb;

  /* Button palette */
  --accent:#2563eb;     /* primary buttons (blue) */
  --accent-2:#16a34a;   /* green buttons */
  --muted:#6b7280;      /* gray buttons */
  --warn:#d32f2f;       /* danger buttons */
}
.admin-link {
  background:none;
  border:none;
  padding:0;
  margin:0;
  color:#0366d6;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
}
.admin-link:hover {
  text-decoration:underline;
}

button, .btn{ background: var(--accent, #2563eb); color:#fff; }
.btn-green{   background: var(--accent-2, #16a34a); }
.btn-muted{   background: var(--muted, #6b7280); }
.btn-warn{    background: var(--warn, #d32f2f); }
    *{ box-sizing:border-box; }
    html{ -webkit-text-size-adjust:100%; } html,body{ height:100%; width:100%; }
    body{ margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
          font-size:16px; line-height:1.4; background:var(--bg); color:var(--fg); overflow-x:hidden; }

    header{ background:var(--brand); color:#fff; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    header h2{ margin:0; font-size:20px; letter-spacing:.2px; }
    nav{ margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; }
    nav a{ color:#fff; text-decoration:none; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,.15); }
    nav a:hover{ background:rgba(255,255,255,.25); }

    .container{ width:100%; max-width:100%; padding:12px; }

    .row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .row>*{ min-width:0; } .grow{ flex:1 1 0; } .nowrap{ white-space:nowrap; }

    /* Buttons (smaller, mobile-friendly) */
button, .btn{
  padding: 8px 12px;       /* was 12px 16px */
  border: none;
  border-radius: 8px;      /* was 10px */
  background: var(--accent);
  color:#fff;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  box-shadow: 0 1px 0 rgba(0,0,0,.05);
  font-size: 15px;         /* was 16px */
}
button:hover, .btn:hover{ filter: brightness(.95); }
.btn-green{ background: var(--accent-2); }
.btn-warn { background: var(--warn); }
.btn-muted{ background: var(--muted); }
.btn-link { background: transparent; color:#0366d6; padding:0; border-radius:0; }


    input,select,textarea{ width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:16px; background:#fff; }
    .input-sm{ width:120px !important; flex:0 0 120px !important; }

    pre{ margin:0; padding:8px; white-space:pre-wrap; word-break:break-word; overflow-x:auto;
         font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
         background:#fff; border:1px solid #eee; border-radius:8px; }

    .table-responsive{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table{ width:100%; border-collapse:collapse; background:#fff; }
    th,td{ padding:10px; border-bottom:1px solid var(--border); text-align:left; }
    thead th{ background:#f6f6f6; }
/* Tiny action buttons inside the cart table */
#cartTable button{
  padding: 2px 8px;
  font-size: 13px;
  line-height: 1;
  border-radius: 6px;
  min-width: 0;           /* prevent stretching */
}

    @media (max-width:600px){
  header h2{ font-size:18px; }
  nav a{ padding:6px 8px; }
  /* smaller buttons on phones, but not full-width */
  button, .btn{
    padding: 6px 10px;
    font-size: 14px;
  }
  th, td{ padding:8px; }
}


    @media print{ header,nav,.no-print{ display:none !important; } body{ margin:0; background:#fff; } .container{ padding:0; } }

    /* 3-inch label rules (only when print page sets body.is-print) */
    body.is-print .container{ padding:0; } body.is-print .preview{ width:100vw; max-width:100vw; margin:0; }
    body.is-print pre{ margin:0; padding:8px; font-size:18px; line-height:1.3; border-radius:0; border:0; }
    @media print{
      body.is-print, body.is-print .container{ width:76.2mm !important; margin:0 !important; padding:0 !important; }
      body.is-print .preview{ width:76.2mm !important; margin:0 !important; }
      body.is-print pre{ margin:0; padding:0; font-size:12px; line-height:1.2; border:0; white-space:pre; }
      @page{ size:76.2mm auto; margin:0; }
    }
  </style>
  <!-- Favicon + app icons -->
<link rel="icon" type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}?v=2">
<link rel="icon" type="image/png" sizes="32x32"
      href="{{ url_for('static', filename='favicon-32.png') }}?v=2">
<link rel="apple-touch-icon" sizes="180x180"
      href="{{ url_for('static', filename='apple-touch-icon.png') }}?v=2">

</head>
<body class="{{ body_class|default('') }}">
  <header>
    <h2>DRIP Fashions</h2>
    <nav>
  <a href="{{ url_for('billing') }}">Billing</a>
  <a href="{{ url_for('history') }}">History</a>
   <!-- <a href="{{ url_for('home') }}">Home</a>-->
  <a href="{{ url_for('inventory.inventory_page') }}">Inventory</a>
  {% if is_admin %}
  <a href="{{ url_for('labels.page') }}">Barcodes</a>
  <a href="{{ url_for('reports.profit') }}">Reports</a>
  {% endif %}
  
  <a href="{{ url_for('auth.logout') }}" class="logout">
    Logout
  </a>

  
<span class="spacer"></span>

{% if is_admin %}
  <!-- Logged-in: show simple "Admin Off" text link -->
  <form method="post" action="{{ url_for('admin_logout') }}" style="display:inline;">
    <button type="submit" class="admin-link">Admin Off</button>
  </form>
{% else %}
  <!-- Logged-out: "Admin" text; clicking reveals the PIN form -->
  <a href="#" id="adminLink" class="admin-link">Admin</a>

  <form id="adminForm" method="post" action="{{ url_for('admin_login') }}"
        style="display:none; margin-left:8px; align-items:center; gap:6px;">
    <input type="hidden" name="next" value="{{ request.full_path or request.path }}">
    <input id="adminPin" type="password" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4"
           placeholder="PIN" aria-label="Admin PIN" autocomplete="off"
           style="width:60px; text-align:center; padding:4px; font-size:14px; border-radius:4px; border:1px solid #ccc;" />
    <button type="submit" class="admin-link">Go</button>
    {% if request.args.get('err') == 'badpin' %}
      <small style="color:#d32f2f;">Invalid PIN</small>
    {% endif %}
  </form>
{% endif %}




<script>
  (function () {
    const link = document.getElementById('adminLink');
    const form = document.getElementById('adminForm');
    const pin  = document.getElementById('adminPin');

    if (!link || !form) return;

    function showForm() {
      link.style.display = 'none';
      form.style.display = 'inline-flex';
      if (pin) pin.focus();
    }

    link.addEventListener('click', function (e) {
      e.preventDefault();
      showForm();
    });

    // If server sent ?err=badpin, auto-open the form so the user can retry
    const qp = new URLSearchParams(window.location.search);
    if (qp.get('err') === 'badpin') showForm();
  })();
</script>


</nav>


  </header>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
