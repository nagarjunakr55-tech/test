{% extends "base.html" %}
{% block content %}
<h2>Barcodes / TSPL</h2>

<p>This page has quick actions to print via the Android app.</p>

<h3>Quick test</h3>
<ul>
  <li>
    <a class="btn"
       href="tspl://print?base={{ base|urlencode }}&code=PING&copies=1">
      Print PING (Android app)
    </a>
  </li>
  <li>
    <a class="btn"
       href="{{ url_for('labels.tspl_for_code', code='PING') }}"
       target="_blank">
      Open PING TSPL (browser)
    </a>
  </li>
</ul>

<hr>

<h3>Print a specific code</h3>
<form onsubmit="event.preventDefault(); goPrint();">
  <label>Code:&nbsp;
    <input id="codeInput" type="text" placeholder="ABC123" required />
  </label>
  <label>&nbsp;Copies:&nbsp;
    <input id="copiesInput" type="number" min="1" value="1" />
  </label>
  <button type="submit" class="btn">Print via Android (Bluetooth)</button>
</form>

<p style="margin-top:10px">
  Or open the TSPL in browser:
  <a id="tsplHttpLink" href="#" target="_blank">/labels/tspl/&lt;code&gt;.txt</a>
</p>

<script>
function goPrint() {
  const code   = document.getElementById('codeInput').value.trim();
  const copies = Math.max(1, parseInt(document.getElementById('copiesInput').value || '1', 10));
  if (!code) { alert('Enter a code'); return; }
  const base = "{{ base }}";
  const deeplink = `tspl://print?base=${encodeURIComponent(base)}&code=${encodeURIComponent(code)}&copies=${copies}`;
  // update the HTTP link too
  const http = `${base}/labels/tspl/${encodeURIComponent(code)}.txt`;
  document.getElementById('tsplHttpLink').href = http;
  // navigate to deep link (Android app should catch it)
  window.location.href = deeplink;
}
</script>

{% endblock %}
