{% extends "base.html" %}
{% block content %}
<h2>Billing</h2>

<!-- Top-right utility link to show manual add -->
<div class="row" style="justify-content:flex-end; margin-bottom:6px;">
  <button id="btnToggleManual" class="btn-link">Add item manually</button>
</div>

<!-- Customer -->
<div class="row">
  <label for="custName" class="nowrap">Name</label>
  <input id="custName" class="grow" type="text" placeholder="Guest" value="Guest" autocomplete="name">

  <label for="custPhone" class="nowrap">Phone</label>
  <input id="custPhone" class="grow" type="tel" inputmode="numeric" pattern="[0-9]*"
         placeholder="10 digits" maxlength="10" autocomplete="tel" value="9848022338">
</div>

<!-- Barcode (manual input only) -->
<div class="row" style="margin-top:10px;">
  <label for="barcode" class="nowrap">Barcode</label>
  <input id="barcode" class="grow" type="text" 
       placeholder="Enter Barcode" 
       autocomplete="off">

  <button id="btnBarcode"
        style="background:#ff9800;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Add
  </button>

  <button id="btnScan" type="button"
        style="background:#9c27b0;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;">
    Scan
  </button>
</div>

<!-- MANUAL add area (hidden by default) -->
<div id="manualBox" style="display:none; margin-top:10px;">
  <div class="row" style="margin-top:4px;">
    <input id="mBrand" type="text" placeholder="Brand" class="grow" style="min-width:160px;">
    <select id="mCategory" style="min-width:120px;">
      <option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
    </select>
    <select id="mSize" style="min-width:90px;"></select>
    <input id="mPrice" type="number" min="0" step="1" placeholder="Price" style="width:120px;">
    <input id="mQty" type="number" min="1" step="1" value="1" style="width:90px;">
  </div>
  <div class="row" style="margin-top:6px;">
    <button id="btnAdd">Add</button>
    <button id="btnSearch">Search Product</button>
  </div>
</div>

<script>
  // Force barcode input to uppercase
  document.getElementById('barcode').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });
  const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
  function round0(n){ return Math.round(Number(n || 0)); }
  function money(n){ return '₹' + (Number(n||0).toFixed(2)); }

  /* Min profit floor used by the Floor button */
  const MIN_PROFIT = 100;
</script>

<style>
  #loyaltyPanel .nowrap { white-space: nowrap; }

  .sp-input{
    width: 6ch;
    max-width: 6ch;
    min-width: 6ch;
    text-align: right;
    padding: 2px 4px;
  }

  /* Modal input – tidy on mobile */
  #manualTotalInput::-webkit-outer-spin-button,
  #manualTotalInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>

<!-- Search modal -->
<div id="searchModal" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000;">
  <div style="background:#fff; margin:8vh auto; padding:12px; max-width:700px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <h3>Search Product</h3>
    <div class="row">
      <input id="sBrand" placeholder="brand contains..." class="grow" style="min-width:140px;">
      <select id="sCategory" style="min-width:140px;">
        <option value="">Any</option><option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
      </select>
      <input id="sSize" placeholder="size (optional)" style="width:140px;">
      <button id="sGo">Search</button>
      <button id="sClose">Close</button>
    </div>
    <div id="sResults" style="margin-top:10px; max-height:380px; overflow:auto; border:1px solid #eee;"></div>
  </div>
</div>

<!-- Cart table -->
<div class="table-responsive" style="margin-top:12px;">
  <table id="cartTable">
    <colgroup>
      <col style="width:16%;">
      <col style="width:16%;">
      <col style="width:10%;">
      <col style="width:10%;">
      <col style="width:12%;">
      <col style="width:18%;">  <!-- Price -->
      <col style="width:4%;">   <!-- (kept for layout balance) -->
    </colgroup>
    <thead>
      <tr style="background:#f5f5f5;">
        <th style="text-align:left;">Brand</th>
        <th style="text-align:left;">Category</th>
        <th style="text-align:left;">Size</th>
        <th style="text-align:left;">Qty</th>
        <th style="text-align:right;">MRP</th>
        <th style="text-align:right;">Price</th>
        <th style="text-align:right;"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Totals + discount -->
<div class="row" style="margin-top:10px;">
  <input id="discount" class="input-sm" autocomplete="off" inputmode="numeric" pattern="\d{2}" maxlength="2" title="Enter a 2-digit number (10–99)" style="width:2.5em; max-width:40px; text-align:center; padding:6px;">
  <button id="applyDiscount"
        style="background:#2196f3;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Discount
  </button>

  <strong id="totalLbl">Total: ₹0.00</strong>
  <strong id="finalLbl">Final: ₹0.00</strong>

  <button id="btnProceed"
        style="background:#4caf50;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Proceed
  </button>

  <button id="btnAndroidPrint"
        style="background:#795548;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;opacity:0.6;cursor:not-allowed;"
        disabled>
    Print
  </button>

  <button id="btnClear"
        style="background:#e53935;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;">
    Clear
  </button>
</div>

<!-- Loyalty panel -->
<div id="loyaltyPanel" class="row" style="margin-top:10px; align-items:center; gap:10px; display:flex;">
  <span id="lpAvail" title="Available points">Available: 0</span>
  <span id="lpEarnPreview" title="Estimated points you’ll earn on this bill">(Earn: 0)</span>
  <input id="lpRedeem" type="text" inputmode="numeric" pattern="\d*" maxlength="6" style="width:3.5ch; text-align:right; padding:4px;">
  <button id="lpApply" type="button" style="background:#00695c;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">Apply</button>
</div>

<!-- Manual Total Modal (POP) -->
<div id="manualTotalModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:2000;">
  <div style="background:#fff; margin:18vh auto; padding:14px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,.25); border-radius:8px;">
    <h4 style="margin-top:0;">Set Final Amount</h4>
    <p style="margin:.5em 0 1em 0; opacity:.8;">Enter the amount to charge as the final bill (₹):</p>
    <div class="row" style="gap:8px; align-items:center;">
      <span>₹</span>
      <input id="manualTotalInput" type="text" inputmode="numeric" pattern="\\d*" maxlength="7" style="flex:1; text-align:right; padding:6px; border:1px solid #ddd;">
    </div>
    <div class="row" style="margin-top:12px; justify-content:flex-end; gap:8px;">
      <button id="manualTotalCancel" type="button">Cancel</button>
      <button id="manualTotalOk" type="button" style="background:#4caf50;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;">Use this total</button>
    </div>
  </div>
</div>

<!-- Invoice preview -->
<h3 style="margin-top:12px;">Invoice Preview</h3>
<pre id="invoicePreview" style="background:#fff;"></pre>

<script>
/* =========
   Tiny helpers
   ========= */
function round0(n){ return Math.round(Number(n || 0)); }
function money(n){ return '₹' + (Number(n||0).toFixed(2)); }

/* =========================
   Scanner deep link wiring
   ========================= */
function buildCallback() {
  const url = new URL(window.location.href);
  url.searchParams.delete('code');
  return url.toString();
}
function openScanner() {
  const cb = encodeURIComponent(buildCallback());
  const deeplink = `dripscan://scan?callback=${cb}`;
  window.location.href = deeplink;
  setTimeout(() => { /* optional fallback */ }, 1500);
}
document.getElementById('btnScan').addEventListener('click', (e) => {
  e.preventDefault();
  openScanner();
});

/* ===============
   Manual toggles
   =============== */
document.getElementById('btnToggleManual').addEventListener('click', (e)=>{
  e.preventDefault();
  const box = document.getElementById('manualBox');
  box.style.display = (box.style.display === 'none' || !box.style.display) ? 'block' : 'none';
});
const mSize = document.getElementById('mSize');
const mCategory = document.getElementById('mCategory');
function refreshSizes() {
  const c = mCategory.value;
  const sizes = (c === 'Shirt' || c === 'T-Shirt') ? ['S','M','L','XL','XXL','3XL','4XL'] : ['28','30','32','34','36','38','40','42','44'];
  mSize.innerHTML = sizes.map(s=>`<option>${s}</option>`).join('');
}
mCategory.addEventListener('change', refreshSizes);
refreshSizes();

/* =========
   State
   ========= */
let cart = [];
let subtotal = 0, finalTotal = 0;
// Preview/save state
let appliedDiscount = "";  // "NN" numeric string (no %)
let lastPayload = null;    // built on Proceed (preview only)
let lastInvoiceId = null;  // set only after SAVE
let lastInvoiceText = "";  // preview text
// persistence
const KEY_CART  = "drip_cart_v1";
const KEY_DISC  = "[REDACTED_GENERIC_API_KEY_1]";
const KEY_NAME  = "drip_name_v1";
const KEY_PHONE = "drip_phone_v1";
// Loyalty state
let lpAvailable = 0;   // fetched from backend
let lpCap       = 100; // fetched from backend; default 100
let lpRate      = 2;   // points per ₹100; backend can override
let lpRedeem    = 0;   // user-applied this bill

/* ===== Minimal loyalty behaviour (drop-in; preserves existing names/calls) ===== */

/* clamp redeem: only allow multiples of 50, >=50, and <= min(lpAvailable, lpCap) */
function lpClampRedeem(raw) {
  const n = Math.max(0, Math.floor(Number(raw || 0)));
  const cap = Math.min(lpAvailable, lpCap);
  if (cap < 50) return 0;                // can't redeem at all if available less than 50
  const desired = Math.min(n, cap);
  // nearest lower multiple of 50
  const floored50 = Math.floor(desired / 50) * 50;
  return Math.max(0, floored50);
}

function lpEstimatedEarn(finalAmt) {
  const base = Math.max(0, Math.round(Number(finalAmt || 0)));
  return Math.floor(base / 100) * lpRate; // e.g., ₹600 -> 12 when lpRate=2
}

function lpRefreshUI() {
  document.getElementById('lpAvail').textContent = `Available: ${lpAvailable}`;
  const earn = lpEstimatedEarn(finalTotal);
  // keep the original look but updated earn formatting
  document.getElementById('lpEarnPreview').textContent = `(Earn ₹${earn})`;
  // keep showing current redeem value or blank
  document.getElementById('lpRedeem').value = lpRedeem ? String(lpRedeem) : '';
  // disable Apply if not enough available
  const applyBtn = document.getElementById('lpApply');
  if (!applyBtn) return;
  const canRedeem = lpAvailable >= 50;
  applyBtn.disabled = !canRedeem;
  applyBtn.style.opacity = canRedeem ? '1' : '.55';
  applyBtn.title = canRedeem ? 'Apply' : 'Requires at least 50 points to redeem';
}

async function fetchAndSetLoyalty(phone){
  try {
    const r = await fetch(`/api/loyalty_points?phone=${encodeURIComponent(phone)}`);
    const j = await r.json();
    if (j && j.ok) {
      lpAvailable = Number(j.points || 0);
      lpCap       = Number(j.cap || 100);
      lpRate      = Number(j.rate_per_100 || lpRate);
    } else {
      lpAvailable = 0;
    }
  } catch {
    lpAvailable = 0;
  }
  recalc();
  lpRefreshUI();
}

/* ===== end loyalty block ===== */

function persistState() {
  try {
    localStorage.setItem(KEY_CART, JSON.stringify(cart));
    localStorage.setItem(KEY_DISC, appliedDiscount || "");
    localStorage.setItem(KEY_NAME, (document.getElementById('custName').value || 'Guest').trim() || 'Guest');
    localStorage.setItem(KEY_PHONE, (document.getElementById('custPhone').value || '').trim());
  } catch {}
}
function restoreState() {
  try {
    const savedCart = localStorage.getItem(KEY_CART);
    if (savedCart) {
      const arr = JSON.parse(savedCart);
      if (Array.isArray(arr)) cart = arr;
    }
    const savedDisc = localStorage.getItem(KEY_DISC) || "";
    appliedDiscount = savedDisc;
    if (savedDisc) document.getElementById('discount').value = savedDisc;
    const nm = localStorage.getItem(KEY_NAME);
    const ph = localStorage.getItem(KEY_PHONE);
    if (nm) document.getElementById('custName').value = nm;
    if (ph) document.getElementById('custPhone').value = ph;
  } catch {}
}

/* =========
   Helpers
   ========= */
function sameKey(a,b){
  if ((a.code || b.code) && a.code !== b.code) return false;
  return a.brand===b.brand && a.category===b.category && a.size===b.size && Number(a.price)==Number(b.price);
}
function upsertCartItem(newItem){
  const i = cart.findIndex(it => sameKey(it, newItem));
  if (i >= 0) {
    cart[i].qty = Number(cart[i].qty) + Number(newItem.qty||1);
    if (!cart[i].code && newItem.code) cart[i].code = newItem.code;
  } else {
    cart.push(newItem);
  }
  renderCart();
}
function setPrintEnabled(on){
  const btn = document.getElementById('btnPrint');
  if (!btn) return;
  btn.style.pointerEvents = on ? 'auto' : 'none';
  btn.style.opacity = on ? '1' : '.5';
}
function setAndroidPrintReady(on){
  const btn = document.getElementById('btnAndroidPrint');
  btn.disabled = !on;
}
function invalidateCheckout() {
  lastInvoiceId = null;
  lastPayload   = null;
  lastInvoiceText = "";
  setPrintEnabled(false);
  setAndroidPrintReady(false);
  const btn = document.getElementById('btnProceed');
  btn.disabled = false;
  btn.textContent = 'Proceed';
  window.__reservedInvoiceId = null;

}
function globalPct(){
  const raw = (appliedDiscount || '').trim();
  if (!raw) return 0;
  const v = parseFloat(raw);
  return isNaN(v) ? 0 : Math.max(0, v);
}

/* =========
   Totals
   ========= */
function recalc() {
  const gPct = globalPct();

  let subtotalBase = 0;
  let boughtTotal  = 0;

  for (const it of cart) {
    const qty = Number(it.qty || 0);
    subtotalBase += it.price * qty;
    boughtTotal  += it.bought_price * qty;
  }

  let globalDiscAmt = gPct > 0 ? (subtotalBase * gPct / 100) : 0;
  let finalTotalLocal = subtotalBase - globalDiscAmt;

  // profit protection
  if (finalTotalLocal < (boughtTotal + MIN_PROFIT)) {
    finalTotalLocal = subtotalBase;
    globalDiscAmt = 0;
  }

  let finalBeforeRedeem = Math.max(0, finalTotalLocal);
  const appliedRedeem = Math.min(
    lpRedeem,
    Math.min(lpAvailable, lpCap),
    Math.floor(finalBeforeRedeem)
  );

  finalTotal = Math.max(0, finalBeforeRedeem - appliedRedeem);
  subtotal   = subtotalBase;

  document.getElementById('totalLbl').textContent = 'Total: ' + money(subtotal);
  document.getElementById('finalLbl').textContent = 'Final: ' + money(finalTotal);

  lpRefreshUI();
}


/* =================
   Cart rendering
   ================= */
function renderCart() {
  const tbody = document.querySelector('#cartTable tbody');
  tbody.innerHTML = '';

  const gPct = globalPct(); // global discount %

  cart.forEach((it, idx) => {
    const basePrice = Number(it.price || 0);
    const mrp = round0(it.mrp_price || 0);

    // show discounted value visually (global only)
    const effectivePrice = gPct > 0
      ? round0(basePrice * (1 - gPct / 100))
      : round0(basePrice);

    const priceCell = `
      <div style="display:flex; gap:4px; justify-content:flex-end; align-items:center;">
        ${gPct > 0 ? `<span class="orig-muted">(${round0(basePrice)})</span>` : ``}
        <input
          class="sp-input"
          data-i="${idx}"
          type="number"
          min="0"
          step="1"
          inputmode="numeric"
          pattern="\\d*"
          value="${effectivePrice}">
      </div>
    `;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${it.brand || ''}</td>
      <td>${it.category || ''}</td>
      <td>${it.size || ''}</td>
      <td>
        <button type="button" data-act="minus" data-i="${idx}">-</button>
        <span style="display:inline-block; width:28px; text-align:center;">
          ${it.qty}
        </span>
        <button type="button" data-act="plus" data-i="${idx}">+</button>
      </td>
      <td style="text-align:right;">${mrp}</td>
      <td style="text-align:right;">${priceCell}</td>
      <td></td>
    `;

    tbody.appendChild(tr);
  });

  recalc();
  invalidateCheckout();
  persistState();
}
document.querySelector('#cartTable').addEventListener('change', (e) => {
  if (!e.target.classList.contains('sp-input')) return;

  const i = Number(e.target.dataset.i);
  if (Number.isNaN(i) || !cart[i]) return;

  const newPrice = round0(e.target.value);
  const bought   = Number(cart[i].bought_price || 0);

  // profit protection
  if (newPrice < bought + MIN_PROFIT) {
    alert(`Minimum profit must be ₹${MIN_PROFIT}`);
    e.target.value = round0(cart[i].price);
    return;
  }

  // ✅ THIS IS THE CRITICAL LINE
  cart[i].price = newPrice;

  renderCart();
});


/* =================
   Global Discount
   ================= */
document.getElementById('applyDiscount').addEventListener('click', ()=>{
  let raw = (document.getElementById('discount').value || '').trim();

  if (!raw){
    appliedDiscount = "";
    renderCart();
    invalidateCheckout();
    persistState();
    return;
  }

  let pct = raw.endsWith('%') ? parseFloat(raw.slice(0,-1)) : parseFloat(raw);
  const ALLOWED = new Set([10,15,20,25,30,35]);
  if (isNaN(pct) || !ALLOWED.has(pct)) { alert('Invalid Code'); return; }


  appliedDiscount = String(pct);
  document.getElementById('discount').value = String(pct);

  renderCart();
  invalidateCheckout();
  persistState();
});

document.getElementById('discount').addEventListener('input', () => {
  const raw = (document.getElementById('discount').value || '').trim();
  if (!raw) {
    appliedDiscount = "";
    renderCart();
    invalidateCheckout();
    persistState();
  }
});

/* =================
   Barcode handlers
   ================= */
async function addBarcode() {
  const code = document.getElementById('barcode').value.trim();
  document.getElementById('barcode').value = '';
  if (!code) return;
  try {
    const r = await fetch('{{ url_for("billing.api_barcode_lookup") }}', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ barcode: String(code).trim() })
    });
    const j = await r.json();
    if (!j.ok) { alert('Barcode not found'); return; }
    const item = {
      ...j.item,
      mrp_price: round0(j.item.mrp_price),
      price:     round0(j.item.price),
      bought_price: Number(j.item.bought_price || 0),
      qty: Number(j.item.qty || 1)
    };
    upsertCartItem(item);
  } catch { alert('Network error'); }
}
document.getElementById('barcode').addEventListener('keydown', e => { if (e.key==='Enter') addBarcode(); });
document.getElementById('btnBarcode').addEventListener('click', addBarcode);

/* ==================
   Manual add/search
   ================== */
document.getElementById('btnAdd').addEventListener('click', ()=>{
  const brand = document.getElementById('mBrand').value.trim();
  const price = round0(document.getElementById('mPrice').value||0);
  const qty = Math.max(1, parseInt(document.getElementById('mQty').value||1,10));
  const size = document.getElementById('mSize').value;
  const category = document.getElementById('mCategory').value;
  if (!brand || !price) { alert('Enter brand and price'); return; }
  upsertCartItem({ brand, category, size, qty, mrp_price: price, bought_price: price, price});
  document.getElementById('mBrand').value = ''; document.getElementById('mPrice').value = ''; document.getElementById('mQty').value = 1;
});

document.getElementById('btnSearch').addEventListener('click', ()=> document.getElementById('searchModal').style.display='block');
document.getElementById('sClose').addEventListener('click', ()=> document.getElementById('searchModal').style.display='none');

document.getElementById('sGo').addEventListener('click', async ()=>{
  const brand = document.getElementById('sBrand').value.trim();
  const category = document.getElementById('sCategory').value;
  const size = document.getElementById('sSize').value.trim();
  const r = await fetch('{{ url_for("billing.api_search_products") }}', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({brand, category, size, limit: 50})
  });
  const j = await r.json(); const box = document.getElementById('sResults'); box.innerHTML='';
  if (!j.ok || !j.results.length) { box.textContent='No results'; return; }
  j.results.forEach((it)=>{
    const mrpR = round0(it.mrp_price||0), priceR = round0(it.price||0);
    const row = document.createElement('div'); row.style.borderBottom='1px solid #eee'; row.style.padding='6px';
    row.innerHTML = `<strong>${it.brand}</strong> — ${it.category}, ${it.size} | MRP: ${mrpR} | Price: ${priceR} <button>Add</button>`;
    row.querySelector('button').addEventListener('click', ()=> 
      upsertCartItem({...it, qty:1, mrp_price: mrpR, price: priceR})
    );
    box.appendChild(row);
  });
});

/* ==========================
   Autofill name by phone #
   ========================== */
document.getElementById('custPhone').addEventListener('input', async (e)=>{
  const ph = e.target.value.replace(/\D/g,'').slice(0,10);
  e.target.value = ph;

  if (ph.length === 10) {
    try {
      const r = await fetch(`{{ url_for("billing.api_customer_last_name") }}?phone=${ph}`);
      const j = await r.json();
      if (j.ok && j.name) document.getElementById('custName').value = j.name;
    } catch {}

    lpRedeem = 0;
    await fetchAndSetLoyalty(ph);
  }

  invalidateCheckout();
  persistState();
});
document.getElementById('custName').addEventListener('input', ()=>{ invalidateCheckout(); persistState(); });

/* Loyalty: Apply/Remove (minimal safe behaviour)
   - can only redeem when lpAvailable >= 50
   - amounts are clamped to 50-step multiples (50,100,150...) */
document.getElementById('lpApply').addEventListener('click', () => {
  // toggle behaviour: clicking Apply when already applied removes redeem
  if (lpRedeem && lpRedeem > 0) {
    lpRedeem = 0;
    recalc();
    lpRefreshUI();
    invalidateCheckout();
    return;
  }

  const raw = (document.getElementById('lpRedeem')?.value || '').trim();
  const clamped = lpClampRedeem(raw);

  if (clamped === 0) {
    alert('Enter a redeem amount in steps of 50 (50,100,150...) and ensure you have at least 50 points available.');
    document.getElementById('lpRedeem')?.focus();
    return;
  }

  if (clamped % 50 !== 0) {
    alert('Redeem must be in increments of 50.');
    document.getElementById('lpRedeem')?.focus();
    return;
  }

  lpRedeem = clamped;
  recalc();
  lpRefreshUI();
  invalidateCheckout();
});

/* Keep typing restriction small and non-intrusive (digits only) */
document.getElementById('lpRedeem').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});

/* On blur, auto-clamp to nearest lower multiple of 50 (or clear if none allowed) */
document.getElementById('lpRedeem').addEventListener('blur', (e) => {
  const clamped = lpClampRedeem(e.target.value);
  e.target.value = clamped ? String(clamped) : '';
});

/* Optional: Enter to apply (preserves UX if user presses Enter) */
document.getElementById('lpRedeem').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('lpApply').click();
  }
});

/* ==========================
   Proceed / Print / Clear
   ========================== */
const proceedBtn = document.getElementById('btnProceed');
proceedBtn.addEventListener('click', async ()=>{
  if (proceedBtn.disabled) return;
  const name = (document.getElementById('custName').value || 'Guest').trim() || 'Guest';
  const phone = (document.getElementById('custPhone').value || '').trim();
  if (!/^\d{10}$/.test(phone)) { alert('Enter valid 10-digit phone'); return; }
  if (!cart.length) { alert('Cart is empty'); return; }
  proceedBtn.disabled = true; const oldTxt = proceedBtn.textContent; proceedBtn.textContent = 'Preparing...';
  try {
    lastPayload = {
      customer_name: name,
      phone,
      items: cart.map(i => ({
        code: (i.code || ""),
        brand: i.brand, category: i.category, size: i.size,
        qty: Number(i.qty||0),
        mrp_price: round0(i.mrp_price||0),
        bought_price: Number(i.bought_price||0),
        price: round0(i.price||0)
      })),
      discount: appliedDiscount,
      redeem_points: Number(lpRedeem || 0),
      preview: true
    };
    const res = await fetch('{{ url_for("billing.api_checkout") }}', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(lastPayload)
    });
    const j = await res.json();
    if (!j.ok) { alert(j.error || 'Preview failed'); proceedBtn.disabled = false; proceedBtn.textContent = oldTxt; return; }
    lastInvoiceId = null;
    lastInvoiceText = j.invoice_text || '';
    document.getElementById('invoicePreview').textContent = lastInvoiceText;
    setPrintEnabled(true);
    setAndroidPrintReady(true);
    proceedBtn.textContent = 'Ready to Print';
  } catch {
    alert('Network error'); proceedBtn.disabled = false; proceedBtn.textContent = oldTxt;
  }
});

/* Optional desktop print preview */
const btnPrintEl = document.getElementById('btnPrint');
if (btnPrintEl) {
  btnPrintEl.addEventListener('click', (e)=>{
    if (!lastPayload) { e.preventDefault(); alert('Please click Proceed first.'); return; }
    window.print();
  });
}

    (earned > 0 ? `Earned Rs ${earned}\n\n` : `\n`) +
    `Follow us on:\n` +
    `WhatsApp: https://t.ly/hcWjm\n` +
    `Insta: https://t.ly/CGh_x\n\n` +

  );
}

/* === POP: Manual final amount flow === */
let manualOverrideTotal = null;

function openManualTotalModal(defaultValue) {
  const modal = document.getElementById('manualTotalModal');
  const input = document.getElementById('manualTotalInput');
  input.value = String(Math.max(0, Math.round(Number(defaultValue || 0))));
  modal.style.display = 'block';
  setTimeout(()=>input.focus(), 0);
}
function closeManualTotalModal() {
  document.getElementById('manualTotalModal').style.display = 'none';
}
document.getElementById('manualTotalInput').addEventListener('input', (e)=>{
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,7);
});
document.getElementById('manualTotalCancel').addEventListener('click', ()=>{
  manualOverrideTotal = null;
  closeManualTotalModal();
});
document.getElementById('manualTotalOk').addEventListener('click', ()=>{
  const raw = document.getElementById('manualTotalInput').value.trim();
  if (!raw) { alert('Please enter an amount'); return; }
  const val = Math.max(0, Math.round(Number(raw)));
  if (!Number.isFinite(val) || val <= 0) { alert('Invalid amount'); return; }
  manualOverrideTotal = val;
  closeManualTotalModal();
  doAndroidPrintWithOverride(val);
});

/* Single handler for Android Print -> opens POP */
const _printBtn = document.getElementById('btnAndroidPrint');
_printBtn.addEventListener('click', (e)=>{
  e.preventDefault();
  if (!lastPayload) { alert('Please click Proceed first.'); return; }
  openManualTotalModal(finalTotal); // pre-fill with computed final
}, true); // capture, so no other handler can run before this

/* Save/print using EXACT override amount everywhere */

async function doAndroidPrintWithOverride(useTotal){
  // useTotal = exact rupee amount user chose in the modal (Number or numeric string)
  if (!lastPayload) { alert('Please click Proceed first.'); return; }

  const btn = document.getElementById('btnAndroidPrint');
  if (!btn || btn.disabled) return;

  // normalize amount
  const finalOverride = Number(useTotal);
  if (!Number.isFinite(finalOverride) || finalOverride < 0) { alert('Invalid total'); return; }

  btn.disabled = true;
  const oldTxt = btn.textContent;
  btn.textContent = 'Saving…';

  const name  = (document.getElementById('custName').value || 'Guest').trim() || 'Guest';
  const phone = (document.getElementById('custPhone').value || '').trim();

  // Build payload: final save request
  // - override_grand_total: server must treat this as the final charged amount (do not re-deduct loyalty)
  // - charge_amount: explicit representation of final charge for clarity
  // - redeem_points: the points we want the server to actually deduct & record
  const toSave = {
    ...lastPayload,
    preview: false,
    async: true,
    override_grand_total: Math.round(finalOverride),   // integer rupees
    charge_amount: Math.round(finalOverride),
    redeem_points: Number(lpRedeem || 0)
  };
  if (window.__reservedInvoiceId) {
    toSave.invoice_id = window.__reservedInvoiceId;
  }

  try {
    const res = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toSave),
      credentials: 'same-origin'
    });

    const j = await res.json().catch(()=>null);
    if (!j || !j.ok) {
      btn.disabled = false;
      btn.textContent = oldTxt;
      // try to surface server message if available
      const errMsg = (j && j.error) ? j.error : 'Save failed';
      alert(errMsg);
      return;
    }

    // Server returned success and an invoice
    const invoiceId = j.invoice_id || null;
    lastInvoiceId   = invoiceId;
    lastInvoiceText = j.invoice_text || lastInvoiceText || '';

    // Update preview and labels to reflect exact finalOverride
    document.getElementById('invoicePreview').textContent = lastInvoiceText;
    document.getElementById('finalLbl').textContent = 'Final: ₹' + Number(finalOverride).toFixed(2);

    // The server should have deducted the points already (atomic). But update local state:
    // if server communicated remaining points, update lpAvailable (graceful)
    if (typeof j.remaining_points !== 'undefined') {
      lpAvailable = Number(j.remaining_points || 0);
      lpRedeem = 0; // we've consumed redeem; reset local applied redeem for UI clarity
    } else {
      // best-effort: subtract lpRedeem locally so UI matches expectation
      lpAvailable = Math.max(0, Number(lpAvailable || 0) - Number(lpRedeem || 0));
      lpRedeem = 0;
    }
    lpRefreshUI();

    // Build & launch Android deeplink AFTER invoice is cached by server
    const base = window.location.origin;
    const estEarn = lpEstimatedEarn(finalOverride);
    const smsText = buildSmsText(name, finalOverride, estEarn);

    // primary deeplink (app-specific)
    const deeplink = `drip://receipt?base=${encodeURIComponent(base)}&code=${encodeURIComponent(invoiceId || '')}` +
                     `&sms_to=${encodeURIComponent(phone)}&sms_text=${encodeURIComponent(smsText)}`;

    try { window.location.href = deeplink; } catch (e) { /* ignore */ }

    // intent fallback + browser fallback to reprint page
    const intentUrl = `intent://receipt?base=${encodeURIComponent(base)}&code=${encodeURIComponent(invoiceId || '')}` +
                      `&sms_to=${encodeURIComponent(phone)}&sms_text=${encodeURIComponent(smsText)}` +
                      `#Intent;scheme=drip;package=com.drip.tsplprint;S.browser_fallback_url=${encodeURIComponent(base + '/reprint/' + (invoiceId || ''))};end`;
    setTimeout(()=>{ try { window.location.replace(intentUrl); } catch {} }, 250);
    setTimeout(()=>{ try { window.location.href = base + '/reprint/' + (invoiceId || ''); } catch {} }, 1200);

    btn.textContent = 'Sent to printer';

    // mark print-ready UI (so user can reprint / re-send)
    setAndroidPrintReady(false); // we've just printed; disable until next proceed
    setPrintEnabled(true);

  } catch (e) {
    btn.disabled = false;
    btn.textContent = oldTxt;
    console.error('Checkout save error', e);
    alert('Network error while saving.');
  }
}

});

   ========= */
(function init(){
  restoreState();
  renderCart();

  const ph = (document.getElementById('custPhone').value || '').trim();
  if (/^\d{10}$/.test(ph)) fetchAndSetLoyalty(ph);

  const params = new URLSearchParams(window.location.search);
  const code = (params.get('code') || '').trim();
  if (code) {
    document.getElementById('barcode').value = code;
    if (typeof addBarcode === 'function') addBarcode();
    params.delete('code');
    const clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', clean);
  }
})();
