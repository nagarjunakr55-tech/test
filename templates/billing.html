{% extends "base.html" %}
{% block content %}
<h2>Billing</h2>

<!-- Top-right utility link to show manual add -->
<div class="row" style="justify-content:flex-end; margin-bottom:6px;">
  <button id="btnToggleManual" class="btn-link">Add item manually</button>
</div>

<!-- Customer -->
<div class="row">
  <label for="custName" class="nowrap">Name</label>
  <input id="custName" class="grow" type="text" placeholder="Guest" value="Guest" autocomplete="name">

  <label for="custPhone" class="nowrap">Phone</label>
  <input id="custPhone" class="grow" type="tel" inputmode="numeric" pattern="[0-9]*"
         placeholder="10 digits" maxlength="10" autocomplete="tel" value="9848022338">
</div>

<!-- Barcode (manual input only) -->
<div class="row" style="margin-top:10px;">
  <label for="barcode" class="nowrap">Barcode</label>
  <input id="barcode" class="grow" type="text" 
       placeholder="Enter Barcode" 
       autocomplete="off">

  <button id="btnBarcode" style="background:#1976d2;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">Add</button>

  <button id="btnScan" type="button">Scan</button>
</div>

<!-- MANUAL add area (hidden by default) -->
<div id="manualBox" style="display:none; margin-top:10px;">
  <div class="row" style="margin-top:4px;">
    <input id="mBrand" type="text" placeholder="Brand" class="grow" style="min-width:160px;">
    <select id="mCategory" style="min-width:120px;">
      <option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
    </select>
    <select id="mSize" style="min-width:90px;"></select>
    <input id="mPrice" type="number" min="0" step="0.01" placeholder="Price" style="width:120px;">
    <input id="mQty" type="number" min="1" step="1" value="1" style="width:90px;">
  </div>
  <div class="row" style="margin-top:6px;">
    <button id="btnAdd">Add</button>
    <button id="btnSearch">Search Product</button>
  </div>
</div>

<script>
  // Force barcode input to uppercase
  document.getElementById('barcode').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });
</script>

<style>
  .sp-input{
    width: 6ch;          /* ~4 digits + padding/spinners */
    max-width: 6ch;
    min-width: 6ch;
    text-align: right;
    padding: 2px 4px;
  }
  /* optional: hide number spinners so width stays tight */
  .sp-input::-webkit-outer-spin-button,
  .sp-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .sp-input[type=number] { -moz-appearance: textfield; }
</style>


<!-- Search modal -->
<div id="searchModal" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000;">
  <div style="background:#fff; margin:8vh auto; padding:12px; max-width:700px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <h3>Search Product</h3>
    <div class="row">
      <input id="sBrand" placeholder="brand contains..." class="grow" style="min-width:140px;">
      <select id="sCategory" style="min-width:140px;">
        <option value="">Any</option><option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
      </select>
      <input id="sSize" placeholder="size (optional)" style="width:140px;">
      <button id="sGo">Search</button>
      <button id="sClose">Close</button>
    </div>
    <div id="sResults" style="margin-top:10px; max-height:380px; overflow:auto; border:1px solid #eee;"></div>
  </div>
</div>

<!-- Cart table -->
<div class="table-responsive" style="margin-top:12px;">
  <table id="cartTable">
    <thead>
      <tr style="background:#f5f5f5;">
        <th style="text-align:left;">Brand</th>
        <th style="text-align:left;">Category</th>
        <th style="text-align:left;">Size</th>
        <th style="text-align:left;">Qty</th>
        <th style="text-align:right;">MRP</th>
        <th style="text-align:right;">Price</th>
        <th style="text-align:center;"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Totals + discount -->
<div class="row" style="margin-top:10px;">
  <label for="discount" class="nowrap">Discount</label>
  <input id="discount" class="input-sm"  autocomplete="off" inputmode="decimal">
  <button id="applyDiscount">Discount</button>

  <strong id="totalLbl">Total: ₹0.00</strong>
  <strong id="finalLbl">Final: ₹0.00</strong>

  <button id="btnProceed" class="btn-green">Proceed</button>
  <button id="btnPrint" class="btn-gray" disabled>Print</button>
  <button id="btnAndroidPrint" class="btn-blue" disabled>Print to Android</button>
  <button id="btnClear" class="btn-warn">Clear</button>
</div>

<!-- Invoice preview -->
<h3 style="margin-top:12px;">Invoice Preview</h3>
<pre id="invoicePreview" style="background:#fff;"></pre>

<script>
/* =========================
   Scanner deep link wiring
   ========================= */
function buildCallback() {
  const url = new URL(window.location.href);
  url.searchParams.delete('code');
  return url.toString();
}

function openScanner() {
  const cb = encodeURIComponent(buildCallback());
  const deeplink = `dripscan://scan?callback=${cb}`;
  window.location.href = deeplink;
  setTimeout(() => { /* optional fallback */ }, 1500);
}

document.getElementById('btnScan').addEventListener('click', (e) => {
  e.preventDefault();
  openScanner();
});

/* ===============
   Manual toggles
   =============== */
document.getElementById('btnToggleManual').addEventListener('click', (e)=>{
  e.preventDefault();
  const box = document.getElementById('manualBox');
  box.style.display = (box.style.display === 'none' || !box.style.display) ? 'block' : 'none';
});

const mSize = document.getElementById('mSize');
const mCategory = document.getElementById('mCategory');
function refreshSizes() {
  const c = mCategory.value;
  const sizes = (c === 'Shirt' || c === 'T-Shirt') ? ['S','M','L','XL'] : ['28','30','32','34','36','38'];
  mSize.innerHTML = sizes.map(s=>`<option>${s}</option>`).join('');
}
mCategory.addEventListener('change', refreshSizes);
refreshSizes();

/* =========
   State
   ========= */
let cart = [];
let subtotal = 0, finalTotal = 0;
let lastInvoiceId = null;
let appliedDiscount = "";  // "NN%" or "NN"

// persistence
const KEY_CART = "drip_cart_v1";
const KEY_DISC = "drip_discount_v1";

function persistState() {
  try {
    localStorage.setItem(KEY_CART, JSON.stringify(cart));
    localStorage.setItem(KEY_DISC, appliedDiscount || "");
  } catch {}
}

function restoreState() {
  try {
    const savedCart = localStorage.getItem(KEY_CART);
    if (savedCart) {
      const arr = JSON.parse(savedCart);
      if (Array.isArray(arr)) cart = arr;
    }
    const savedDisc = localStorage.getItem(KEY_DISC) || "";
    appliedDiscount = savedDisc;
    if (savedDisc) document.getElementById('discount').value = savedDisc;
  } catch {}
}

/* =========
   Helpers
   ========= */
function money(n){ return '₹' + (Number(n||0).toFixed(2)); }
function sameKey(a,b){
  return a.brand===b.brand && a.category===b.category && a.size===b.size && Number(a.price)==Number(b.price);
}
function upsertCartItem(newItem){
  const i = cart.findIndex(it => sameKey(it, newItem));
  if (i >= 0) cart[i].qty = Number(cart[i].qty) + Number(newItem.qty||1);
  else cart.push(newItem);
  renderCart();
}
function setPrintEnabled(on){
  const btn = document.getElementById('btnPrint');
  btn.style.pointerEvents = on ? 'auto' : 'none';
  btn.style.opacity = on ? '1' : '.5';
}
function invalidateCheckout() {
  lastInvoiceId = null;
  setPrintEnabled(false);
  const btn = document.getElementById('btnProceed');
  btn.disabled = false;
  btn.textContent = 'Proceed';
}

/* =========
   Totals
   ========= */
function recalc() {
  subtotal = cart.reduce((s,i)=> s + Number(i.price||0)*Number(i.qty||0), 0);
  const boughtTotal = cart.reduce((s,i)=> s + Number(i.bought_price||0)*Number(i.qty||0), 0);
  document.getElementById('totalLbl').textContent = 'Total: ' + money(subtotal);

  let discountAmt = 0;
  if (appliedDiscount) {
    if (/%\s*$/.test(appliedDiscount)) {
      const pct = parseFloat(appliedDiscount);
      if (!isNaN(pct) && pct >= 0) discountAmt = subtotal * (pct/100.0);
    } else {
      const flat = parseFloat(appliedDiscount);
      if (!isNaN(flat) && flat >= 0) discountAmt = Math.min(flat, subtotal);
    }
    // Enforce MAX rule for all discounts
    const finalCandidate = subtotal - discountAmt;
    if (finalCandidate < (boughtTotal + 100)) {
      discountAmt = 0; // block if below threshold
    }
  }

  finalTotal = Math.max(0, subtotal - discountAmt);
  document.getElementById('finalLbl').textContent = 'Final: ' + money(finalTotal);
}

/* =================
   Cart rendering
   ================= */
function renderCart() {
  const tb = document.querySelector('#cartTable tbody'); tb.innerHTML = '';
  cart.forEach((it, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${it.brand||''}</td>
      <td>${it.category||''}</td>
      <td>${it.size||''}</td>
      <td>
        <button data-act="minus" data-i="${idx}">-</button>
        <span style="display:inline-block; width:28px; text-align:center;">${it.qty}</span>
        <button data-act="plus" data-i="${idx}">+</button>
      </td>
      <td style="text-align:right;">${Number(it.mrp_price||0).toFixed(2)}</td>
      <td style="text-align:right;">
        <input class="sp-input" data-i="${idx}" type="number" min="0" step="1"
               inputmode="numeric" pattern="\\d*" value="${parseInt(it.price||0,10)}">
      </td>
      <td style="text-align:center;"><button data-act="remove" data-i="${idx}">x</button></td>
    `;
    tb.appendChild(tr);
  });
  recalc();
  invalidateCheckout();
  persistState();
}

document.querySelector('#cartTable').addEventListener('click', (e)=>{
  const btn = e.target; const act = btn.getAttribute('data-act'); const i = +btn.getAttribute('data-i');
  if (act === 'minus') { cart[i].qty = Math.max(0, Number(cart[i].qty)-1); if(cart[i].qty===0) cart.splice(i,1); renderCart(); }
  if (act === 'plus')  { cart[i].qty = Number(cart[i].qty)+1; renderCart(); }
  if (act === 'remove'){ cart.splice(i,1); renderCart(); }
});

// Inline SP Price edit
document.querySelector('#cartTable').addEventListener('change', (e)=>{
  if (!e.target.classList.contains('sp-input')) return;
  const i = +e.target.getAttribute('data-i');
  if (isNaN(i) || !cart[i]) return;

  const v = parseFloat(e.target.value);
  if (isNaN(v) || v < 0) {
    e.target.value = Number(cart[i].price||0).toFixed(2);
    return;
  }
  cart[i].price = v;
  renderCart();
});

/* =================
   Discount controls
   ================= */
document.getElementById('applyDiscount').addEventListener('click', ()=>{
  let raw = (document.getElementById('discount').value || '').trim();
  if (!raw){
    appliedDiscount = "";
    recalc();
    invalidateCheckout();
    persistState();
    return;
  }

  let pct = raw.endsWith('%') ? parseFloat(raw.slice(0,-1)) : parseFloat(raw);
  const ALLOWED = new Set([10,15,20,25,30]);
  if (isNaN(pct) || !ALLOWED.has(pct)) { alert('Invalid Code'); return; }

  const subtotalLocal = cart.reduce((s,i)=> s + Number(i.price||0)*Number(i.qty||0), 0);
  const boughtTotal   = cart.reduce((s,i)=> s + Number(i.bought_price||0)*Number(i.qty||0), 0);
  const discountAmt   = subtotalLocal * (pct/100.0);
  const finalCandidate = subtotalLocal - discountAmt;
  if (finalCandidate < (boughtTotal + 100)) { alert('Maximum discount reached.'); return; }

  appliedDiscount = `${pct}%`;
  recalc();
  invalidateCheckout();
  persistState();
});

// Clear discount as soon as the field is emptied
document.getElementById('discount').addEventListener('input', () => {
  const raw = (document.getElementById('discount').value || '').trim();
  if (!raw) {
    appliedDiscount = "";
    recalc();
    invalidateCheckout();
    persistState();
  }
});

/* =================
   Barcode handlers
   ================= */
async function addBarcode() {
  const code = document.getElementById('barcode').value.trim();
  document.getElementById('barcode').value = '';
  if (!code) return;
  try {
    const r = await fetch('{{ url_for("api_barcode_lookup") }}', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ barcode: String(code).trim() })
    });
    const j = await r.json();
    if (!j.ok) { alert('Barcode not found'); return; }
    upsertCartItem(j.item);
  } catch { alert('Network error'); }
}

document.getElementById('barcode').addEventListener('keydown', e => { if (e.key==='Enter') addBarcode(); });
document.getElementById('btnBarcode').addEventListener('click', addBarcode);

/* ==================
   Manual add/search
   ================== */
document.getElementById('btnAdd').addEventListener('click', ()=>{
  const brand = document.getElementById('mBrand').value.trim();
  const price = parseFloat(document.getElementById('mPrice').value||0);
  const qty = Math.max(1, parseInt(document.getElementById('mQty').value||1,10));
  const size = document.getElementById('mSize').value;
  const category = document.getElementById('mCategory').value;
  if (!brand || !price) { alert('Enter brand and price'); return; }
  upsertCartItem({ brand, category, size, qty, mrp_price: price, bought_price: price, price });
  document.getElementById('mBrand').value = ''; document.getElementById('mPrice').value = ''; document.getElementById('mQty').value = 1;
});

document.getElementById('btnSearch').addEventListener('click', ()=> document.getElementById('searchModal').style.display='block');
document.getElementById('sClose').addEventListener('click', ()=> document.getElementById('searchModal').style.display='none');
document.getElementById('sGo').addEventListener('click', async ()=>{
  const brand = document.getElementById('sBrand').value.trim();
  const category = document.getElementById('sCategory').value;
  const size = document.getElementById('sSize').value.trim();
  const r = await fetch('{{ url_for("api_search_products") }}', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({brand, category, size, limit: 50})
  });
  const j = await r.json(); const box = document.getElementById('sResults'); box.innerHTML='';
  if (!j.ok || !j.results.length) { box.textContent='No results'; return; }
  j.results.forEach((it)=>{
    const row = document.createElement('div'); row.style.borderBottom='1px solid #eee'; row.style.padding='6px';
    row.innerHTML = `<strong>${it.brand}</strong> — ${it.category}, ${it.size} | MRP: ${Number(it.mrp_price||0).toFixed(2)} | Price: ${Number(it.price||0).toFixed(2)} <button>Add</button>`;
    row.querySelector('button').addEventListener('click', ()=> upsertCartItem({...it, qty:1}) );
    box.appendChild(row);
  });
});

/* ==========================
   Autofill name by phone #
   ========================== */
document.getElementById('custPhone').addEventListener('input', async (e)=>{
  const ph = e.target.value.replace(/\D/g,'').slice(0,10); e.target.value = ph;
  if (ph.length === 10) {
    const r = await fetch(`{{ url_for("api_customer_last_name") }}?phone=${ph}`);
    const j = await r.json(); if (j.ok && j.name) document.getElementById('custName').value = j.name;
  }
});

/* ==========================
   Proceed / Print / Clear
   ========================== */
const proceedBtn = document.getElementById('btnProceed');
proceedBtn.addEventListener('click', async ()=>{
  if (proceedBtn.disabled) return;
  const name = (document.getElementById('custName').value || 'Guest').trim() || 'Guest';
  const phone = (document.getElementById('custPhone').value || '').trim();
  if (!/^\d{10}$/.test(phone)) { alert('Enter valid 10-digit phone'); return; }
  if (!cart.length) { alert('Cart is empty'); return; }

  proceedBtn.disabled = true; const oldTxt = proceedBtn.textContent; proceedBtn.textContent = 'Processing...';
  try {
    const payload = {
      customer_name: name,
      phone,
      items: cart.map(i => ({
        brand: i.brand, category: i.category, size: i.size,
        qty: Number(i.qty||0),
        mrp_price: Number(i.mrp_price||0),
        bought_price: Number(i.bought_price||0),
        price: Number(i.price||0)
      })),
      discount: appliedDiscount
    };
    const res = await fetch('{{ url_for("api_checkout") }}', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const j = await res.json();
    if (!j.ok) { alert(j.error || 'Checkout failed'); proceedBtn.disabled = false; proceedBtn.textContent = oldTxt; return; }

    lastInvoiceId = j.invoice_id;
    wireAndroidPrint(lastInvoiceId);     
    document.getElementById('invoicePreview').textContent = j.invoice_text;
    setPrintEnabled(true);
    proceedBtn.textContent = 'Proceeded';
  
  } catch {
    alert('Network error'); proceedBtn.disabled = false; proceedBtn.textContent = oldTxt;
  }
});

document.getElementById('btnPrint').addEventListener('click', (e)=>{
  if (!lastInvoiceId) { e.preventDefault(); alert('Please click Proceed first.'); }
});

document.getElementById('btnClear').addEventListener('click', ()=>{
  appliedDiscount = "";
  document.getElementById('discount').value = '';
  cart = [];
  renderCart(); // recalc + persist inside
  document.getElementById('invoicePreview').textContent = '';
  lastInvoiceId = null;
  setPrintEnabled(false);
});

function wireAndroidPrint(invoiceId) {
  const btn = document.getElementById('btnAndroidPrint');
  if (!btn) return;
  btn.disabled = !invoiceId;
  if (!invoiceId) return;

  btn.onclick = () => {
    const base = window.location.origin;
    const dl = `drip://receipt?base=${encodeURIComponent(base)}&code=${encodeURIComponent(invoiceId)}`;
    window.location.href = dl;
    setTimeout(() => {
      const intent =
        `intent://receipt?base=${encodeURIComponent(base)}&code=${encodeURIComponent(invoiceId)}` +
        `#Intent;scheme=drip;package=com.drip.tsplprint;end`;
      window.location.href = intent;
    }, 800);
  };
}

/* =========
   Init
   ========= */
(function init(){
  restoreState();
  renderCart();

  // Handle scanner return AFTER state/functions exist
  const params = new URLSearchParams(window.location.search);
  const code = (params.get('code') || '').trim();
  if (code) {
    document.getElementById('barcode').value = code;
    if (typeof addBarcode === 'function') addBarcode();
    params.delete('code');
    const clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', clean);
  }
})();
</script>
{% endblock %}
