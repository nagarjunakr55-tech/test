{% extends "base.html" %}
{% block content %}
<h2>Billing</h2>

<!-- Customer -->
<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
  <label for="custName">Name</label>
  <input id="custName" type="text" placeholder="Guest" value="Guest">
  <label for="custPhone">Phone</label>
  <input id="custPhone" type="tel" placeholder="10 digits" maxlength="10" pattern="\d*">
</div>

<!-- Barcode -->
<div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
  <label for="barcode">Barcode</label>
  <input id="barcode" type="text" placeholder="Scan barcode then Enter" style="flex:1;">
  <button id="btnBarcode">Add</button>
  <button id="btnScan">Scan with Camera</button>
</div>

<!-- Manual entry -->
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
  <input id="mBrand" type="text" placeholder="Brand" style="flex:1; min-width:160px;">
  <select id="mCategory" style="min-width:120px;">
    <option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
  </select>
  <select id="mSize" style="min-width:90px;"></select>
  <input id="mPrice" type="number" min="0" step="0.01" placeholder="Price" style="width:120px;">
  <input id="mQty" type="number" min="1" step="1" value="1" style="width:90px;">
  <button id="btnAdd">Add</button>
  <button id="btnSearch">Search Product</button>
</div>

<!-- Search modal -->
<div id="searchModal" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000;">
  <div style="background:#fff; margin:8vh auto; padding:12px; max-width:700px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <h3>Search Product</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <input id="sBrand" placeholder="brand contains..." style="flex:1; min-width:140px;">
      <select id="sCategory" style="min-width:140px;"><option value="">Any</option><option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option></select>
      <input id="sSize" placeholder="size (optional)" style="width:140px;">
      <button id="sGo">Search</button>
      <button id="sClose">Close</button>
    </div>
    <div id="sResults" style="margin-top:10px; max-height:380px; overflow:auto; border:1px solid #eee;"></div>
  </div>
</div>

<!-- Camera Scan Modal -->
<div id="scanModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000;">
  <div style="background:#fff; margin:6vh auto; padding:12px; max-width:520px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <h3>Scan barcode</h3>
    <video id="scanVideo" playsinline muted autoplay style="width:100%; background:#000; border-radius:6px;"></video>
    <div style="margin-top:8px; display:flex; gap:8px; align-items:center; justify-content:space-between;">
      <select id="cameraSelect" style="flex:1;"></select>
      <button id="scanClose">Close</button>
    </div>
    <p id="scanStatus" style="font-size:12px; color:#666; margin-top:6px;">Point the camera at a barcode…</p>
  </div>
</div>

<!-- Cart table -->
<div class="table-responsive" style="margin-top:12px;">
  <table id="cartTable" style="width:100%; border-collapse:collapse;">
    <thead>
      <tr style="background:#f5f5f5;">
        <th style="text-align:left; padding:6px;">Brand</th>
        <th style="text-align:left; padding:6px;">Category</th>
        <th style="text-align:left; padding:6px;">Size</th>
        <th style="text-align:left; padding:6px;">Qty</th>
        <th style="text-align:right; padding:6px;">MRP</th>
        <th style="text-align:right; padding:6px;">SP Price</th>
        <th style="text-align:right; padding:6px;">Subtotal</th>
        <th style="text-align:center; padding:6px;"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Totals + discount -->
<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px;">
  <label for="discount">Discount</label>
  <input id="discount" placeholder="e.g. 20% or 100">
  <button id="applyDiscount">Apply Discount</button>

  <strong id="totalLbl">Total: ₹0.00</strong>
  <strong id="finalLbl">Final: ₹0.00</strong>

  <button id="btnProceed" class="btn" style="background:#388E3C; color:white; padding:6px 12px; border-radius:6px;">Proceed</button>
  <a id="btnPrint" class="btn" style="pointer-events:none; opacity:.5; background:#607D8B; color:white; padding:6px 12px; border-radius:6px;" href="#" target="_blank">Print</a>
  <button id="btnClear" class="btn" style="background:#FF5722; color:white; padding:6px 12px; border-radius:6px;">Clear Cart</button>
</div>

<!-- Invoice preview -->
<h3 style="margin-top:12px;">Invoice Preview</h3>
<pre id="invoicePreview" style="white-space:pre-wrap; background:#fafafa; border:1px solid #eee; padding:8px; min-height:120px;"></pre>

<!-- Load ZXing BEFORE our script -->
<script src="https://unpkg.com/@zxing/library@0.19.1"></script>

<script>
// ---------- Sizes ----------
const mSize = document.getElementById('mSize');
const mCategory = document.getElementById('mCategory');
function refreshSizes() {
  const c = mCategory.value;
  const sizes = (c === 'Shirt' || c === 'T-Shirt') ? ['S','M','L','XL'] : ['28','30','32','34','36','38'];
  mSize.innerHTML = sizes.map(s=>`<option>${s}</option>`).join('');
}
mCategory.addEventListener('change', refreshSizes);
refreshSizes();

// ---------- State ----------
let cart = [];
let subtotal = 0, finalTotal = 0;
let lastInvoiceId = null;
// Discount is ONLY applied when the button is clicked
let appliedDiscount = "";  // "20%" or "100"

// ---------- Helpers ----------
function money(n){ return '₹' + (Number(n||0).toFixed(2)); }
function sameKey(a,b){
  return a.brand===b.brand && a.category===b.category && a.size===b.size
         && Number(a.price)==Number(b.price);
}
function upsertCartItem(newItem){
  const i = cart.findIndex(it => sameKey(it, newItem));
  if (i >= 0) cart[i].qty = Number(cart[i].qty) + Number(newItem.qty||1);
  else cart.push(newItem);
  renderCart();
}
function setPrintEnabled(on){
  const btn = document.getElementById('btnPrint');
  btn.style.pointerEvents = on ? 'auto' : 'none';
  btn.style.opacity = on ? '1' : '.5';
}
function invalidateCheckout() {
  lastInvoiceId = null;
  setPrintEnabled(false);
  const btn = document.getElementById('btnProceed');
  btn.disabled = false;
  btn.textContent = 'Proceed';
}

// ---------- Totals (use ONLY appliedDiscount) ----------
function recalc() {
  subtotal = cart.reduce((s,i)=> s + Number(i.price||0)*Number(i.qty||0), 0);
  const boughtTotal = cart.reduce((s,i)=> s + Number(i.bought_price||0)*Number(i.qty||0), 0);
  document.getElementById('totalLbl').textContent = 'Total: ' + money(subtotal);

  let discountAmt = 0;
  if (appliedDiscount) {
    if (appliedDiscount.endsWith('%')) {
      const pct = parseFloat(appliedDiscount.slice(0, -1));
      if (!isNaN(pct) && pct >= 0 && pct <= 100) {
        discountAmt = subtotal * (pct/100.0); // NO max rule for %
      }
    } else {
      // flat, enforce max rule (UI mirror; server also enforces)
      const flat = parseFloat(appliedDiscount);
      if (!isNaN(flat) && flat >= 0) {
        const grandAfter = subtotal - flat;
        if (grandAfter >= (boughtTotal + 250)) {
          discountAmt = Math.min(flat, subtotal);
        } else {
          // if cart changed and now violates, keep discount unapplied visually
          discountAmt = 0;
        }
      }
    }
  }

  finalTotal = Math.max(0, subtotal - discountAmt);
  document.getElementById('finalLbl').textContent = 'Final: ' + money(finalTotal);
}

// ---------- Cart rendering ----------
function renderCart() {
  const tb = document.querySelector('#cartTable tbody');
  tb.innerHTML = '';
  cart.forEach((it, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="padding:6px; border-top:1px solid #eee;">${it.brand||''}</td>
      <td style="padding:6px; border-top:1px solid #eee;">${it.category||''}</td>
      <td style="padding:6px; border-top:1px solid #eee;">${it.size||''}</td>
      <td style="padding:6px; border-top:1px solid #eee;">
        <button data-act="minus" data-i="${idx}">-</button>
        <span style="display:inline-block; width:28px; text-align:center;">${it.qty}</span>
        <button data-act="plus" data-i="${idx}">+</button>
      </td>
      <td style="padding:6px; border-top:1px solid #eee; text-align:right;">${Number(it.mrp_price||0).toFixed(2)}</td>
      <td style="padding:6px; border-top:1px solid #eee; text-align:right;">${Number(it.price||0).toFixed(2)}</td>
      <td style="padding:6px; border-top:1px solid #eee; text-align:right;">${money((it.price||0)*(it.qty||0))}</td>
      <td style="padding:6px; border-top:1px solid #eee; text-align:center;"><button data-act="remove" data-i="${idx}">x</button></td>
    `;
    tb.appendChild(tr);
  });
  recalc();
  invalidateCheckout();  // any cart change cancels previous proceed
}

document.querySelector('#cartTable').addEventListener('click', (e)=>{
  const btn = e.target;
  const act = btn.getAttribute('data-act');
  const i = +btn.getAttribute('data-i');
  if (act === 'minus') { cart[i].qty = Math.max(0, Number(cart[i].qty)-1); if(cart[i].qty===0) cart.splice(i,1); renderCart(); }
  if (act === 'plus')  { cart[i].qty = Number(cart[i].qty)+1; renderCart(); }
  if (act === 'remove'){ cart.splice(i,1); renderCart(); }
});

// ---------- Apply Discount (only place discount takes effect) ----------
document.getElementById('applyDiscount').addEventListener('click', ()=>{
  const inputStr = (document.getElementById('discount').value || '').trim();
  if (!inputStr) {
    appliedDiscount = "";
    recalc(); invalidateCheckout();
    return;
  }

  const boughtTotal = cart.reduce((s,i)=> s + Number(i.bought_price||0)*Number(i.qty||0), 0);

  if (inputStr.endsWith('%')) {
    const pct = parseFloat(inputStr.slice(0,-1));
    if (isNaN(pct) || pct < 0 || pct > 100) {
      alert('Invalid discount.');
      return;
    }
    // percent -> NO max rule
    appliedDiscount = inputStr;
    recalc(); invalidateCheckout();
  } else {
    // flat -> enforce max rule
    const flat = parseFloat(inputStr);
    if (isNaN(flat) || flat < 0) {
      alert('Invalid discount.');
      return;
    }
    const subtotalLocal = cart.reduce((s,i)=> s + Number(i.price||0)*Number(i.qty||0), 0);
    const grandAfter = subtotalLocal - flat;
    if (grandAfter < (boughtTotal + 250)) {
      alert('Maximum discount reached.');
      return; // do not apply
    }
    appliedDiscount = String(flat);
    recalc(); invalidateCheckout();
  }
});

// ---------- Barcode (manual) ----------
async function addBarcode() {
  const code = document.getElementById('barcode').value.trim();
  document.getElementById('barcode').value = '';
  if (!code) return;
  await addBarcodeByCode(code);
}
async function addBarcodeByCode(code) {
  if (!code) return;
  try {
    const r = await fetch('{{ url_for("api_barcode_lookup") }}', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ barcode: String(code).trim() })
    });
    const j = await r.json();
    if (!j.ok) { alert('Barcode not found'); return; }
    upsertCartItem(j.item);
  } catch (e) {
    alert('Network error');
  }
}
document.getElementById('barcode').addEventListener('keydown', e => { if (e.key==='Enter') addBarcode(); });
document.getElementById('btnBarcode').addEventListener('click', addBarcode);

// ---------- Manual add ----------
document.getElementById('btnAdd').addEventListener('click', ()=>{
  const brand = document.getElementById('mBrand').value.trim();
  const price = parseFloat(document.getElementById('mPrice').value||0);
  const qty = Math.max(1, parseInt(document.getElementById('mQty').value||1,10));
  const size = document.getElementById('mSize').value;
  const category = document.getElementById('mCategory').value;
  if (!brand || !price) { alert('Enter brand and price'); return; }
  upsertCartItem({
    brand, category, size, qty,
    mrp_price: price,
    bought_price: price,   // if unknown, mirror selling price; server rule still OK
    price
  });
  document.getElementById('mBrand').value = '';
  document.getElementById('mPrice').value = '';
  document.getElementById('mQty').value = 1;
});

// ---------- Search modal ----------
document.getElementById('btnSearch').addEventListener('click', ()=> document.getElementById('searchModal').style.display='block');
document.getElementById('sClose').addEventListener('click', ()=> document.getElementById('searchModal').style.display='none');
document.getElementById('sGo').addEventListener('click', async ()=>{
  const brand = document.getElementById('sBrand').value.trim();
  const category = document.getElementById('sCategory').value;
  const size = document.getElementById('sSize').value.trim();
  const r = await fetch('{{ url_for("api_search_products") }}', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({brand, category, size, limit: 50})
  });
  const j = await r.json();
  const box = document.getElementById('sResults'); box.innerHTML='';
  if (!j.ok || !j.results.length) { box.textContent='No results'; return; }
  j.results.forEach((it, idx)=>{
    const row = document.createElement('div');
    row.style.borderBottom='1px solid #eee';
    row.style.padding='6px';
    row.innerHTML = `
      <strong>${it.brand}</strong> — ${it.category}, ${it.size}
      | MRP: ${Number(it.mrp_price||0).toFixed(2)}
      | Price: ${Number(it.price||0).toFixed(2)}
      <button data-idx="${idx}">Add</button>
    `;
    row.querySelector('button').addEventListener('click', ()=>{
      upsertCartItem({...it, qty:1});
    });
    box.appendChild(row);
  });
});

// ---------- Autofill name by phone ----------
document.getElementById('custPhone').addEventListener('input', async (e)=>{
  const ph = e.target.value.replace(/\D/g,'').slice(0,10);
  e.target.value = ph;
  if (ph.length === 10) {
    const r = await fetch(`{{ url_for("api_customer_last_name") }}?phone=${ph}`);
    const j = await r.json();
    if (j.ok && j.name) document.getElementById('custName').value = j.name;
  }
});

// ---------- Proceed (save + preview) ----------
const proceedBtn = document.getElementById('btnProceed');
proceedBtn.addEventListener('click', async ()=>{
  if (proceedBtn.disabled) return;
  const name = (document.getElementById('custName').value || 'Guest').trim() || 'Guest';
  const phone = (document.getElementById('custPhone').value || '').trim();
  if (!/^\d{10}$/.test(phone)) { alert('Enter valid 10-digit phone'); return; }
  if (!cart.length) { alert('Cart is empty'); return; }

  const discount = appliedDiscount;

  proceedBtn.disabled = true;
  const oldTxt = proceedBtn.textContent;
  proceedBtn.textContent = 'Processing...';

  try {
    const payload = {
      customer_name: name,
      phone,
      items: cart.map(i => ({
        brand: i.brand, category: i.category, size: i.size,
        qty: Number(i.qty||0),
        mrp_price: Number(i.mrp_price||0),
        bought_price: Number(i.bought_price||0),
        price: Number(i.price||0)
      })),
      discount
    };
    const res = await fetch('{{ url_for("api_checkout") }}', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'max_discount_reached') alert('Maximum discount reached.');
      else if (j.error === 'invalid_discount') alert('Invalid discount.');
      else alert(j.error || 'Checkout failed');
      proceedBtn.disabled = false; proceedBtn.textContent = oldTxt;
      return;
    }

    lastInvoiceId = j.invoice_id;
    document.getElementById('invoicePreview').textContent = j.invoice_text;

    const printBtn = document.getElementById('btnPrint');
    printBtn.href = '{{ url_for("print_invoice", invoice_id="__ID__") }}'.replace('__ID__', lastInvoiceId);
    setPrintEnabled(true);

    proceedBtn.textContent = 'Proceeded'; // re-enabled once cart/discount changes
  } catch (e) {
    alert('Network error');
    proceedBtn.disabled = false; proceedBtn.textContent = oldTxt;
  }
});

// ---------- Print guard ----------
document.getElementById('btnPrint').addEventListener('click', (e)=>{
  if (!lastInvoiceId) {
    e.preventDefault();
    alert('Please click Proceed first.');
  }
});

// ---------- Clear ----------
document.getElementById('btnClear').addEventListener('click', ()=>{
  cart = [];
  renderCart();
  document.getElementById('discount').value = '';
  appliedDiscount = "";
  document.getElementById('invoicePreview').textContent = '';
  lastInvoiceId = null;
  setPrintEnabled(false);
});

// ---------- Init ----------
(function init(){
  renderCart();
})();

// ===== Camera Scan (ZXing) =====
let zxingReader = null;
let zxingControls = null;

async function startCameraScan() {
  const modal = document.getElementById('scanModal');
  const video = document.getElementById('scanVideo');
  const select = document.getElementById('cameraSelect');
  const status = document.getElementById('scanStatus');

  modal.style.display = 'block';
  status.textContent = 'Starting camera…';

  try {
    zxingReader = new ZXing.BrowserMultiFormatReader();

    // list cameras
    const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
    if (!devices || devices.length === 0) {
      status.textContent = 'No camera found on this device.';
      return;
    }
    // populate selector
    select.innerHTML = devices.map(d => `<option value="${d.deviceId}">${d.label || d.deviceId}</option>`).join('');
    // pick a back camera if present
    const preferredId = (devices.find(d => /back|rear/i.test(d.label)) || devices[0]).deviceId;

    const startDecoding = async (deviceId) => {
      status.textContent = 'Point the camera at a barcode…';
      await zxingReader.decodeFromVideoDevice(deviceId, video, (result, err, controls) => {
        zxingControls = controls;
        if (result) {
          stopCameraScan();
          const text = result.getText().trim();
          addBarcodeByCode(text);
        }
        // ignore err (stream continues until a result)
      });
    };

    await startDecoding(preferredId);

    // switching camera
    select.onchange = async () => {
      if (zxingControls) zxingControls.stop();
      if (zxingReader) zxingReader.reset();
      await startDecoding(select.value);
    };
  } catch (e) {
    status.textContent = 'Could not start camera: ' + e;
  }
}

function stopCameraScan() {
  if (zxingControls) { zxingControls.stop(); zxingControls = null; }
  if (zxingReader) { zxingReader.reset(); zxingReader = null; }
  document.getElementById('scanModal').style.display = 'none';
}

document.getElementById('btnScan').addEventListener('click', startCameraScan);
document.getElementById('scanClose').addEventListener('click', stopCameraScan);
</script>
{% endblock %}
