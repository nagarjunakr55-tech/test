{% extends "base.html" %}
{% block content %}
<h2>Billing</h2>

<!-- Top-right utility link to show manual add -->
<div class="row" style="justify-content:flex-end; margin-bottom:6px;">
  <button id="btnToggleManual" class="btn-link">Add item manually</button>
</div>

<!-- Customer -->
<div class="row">
  <label for="custName" class="nowrap">Name</label>
  <input id="custName" class="grow" type="text" placeholder="Guest" value="Guest" autocomplete="name">

  <label for="custPhone" class="nowrap">Phone</label>
  <input id="custPhone" class="grow" type="tel" inputmode="numeric" pattern="[0-9]*"
         placeholder="10 digits" maxlength="10" autocomplete="tel" value="9848022338">
</div>

<!-- Barcode (manual input only) -->
<div class="row" style="margin-top:10px;">
  <label for="barcode" class="nowrap">Barcode</label>
  <input id="barcode" class="grow" type="text" 
       placeholder="Enter Barcode" 
       autocomplete="off">

  <button id="btnBarcode"
        style="background:#ff9800;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Add
  </button>

  <button id="btnScan" type="button"
        style="background:#9c27b0;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;">
    Scan
  </button>
</div>

<!-- MANUAL add area (hidden by default) -->
<div id="manualBox" style="display:none; margin-top:10px;">
  <div class="row" style="margin-top:4px;">
    <input id="mBrand" type="text" placeholder="Brand" class="grow" style="min-width:160px;">
    <select id="mCategory" style="min-width:120px;">
      <option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
    </select>
    <select id="mSize" style="min-width:90px;"></select>
    <input id="mPrice" type="number" min="0" step="1" placeholder="Price" style="width:120px;">
    <input id="mQty" type="number" min="1" step="1" value="1" style="width:90px;">
  </div>
  <div class="row" style="margin-top:6px;">
    <button id="btnAdd">Add</button>
    <button id="btnSearch">Search Product</button>
  </div>
</div>

<script>
  // Force barcode input to uppercase
  document.getElementById('barcode').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });
  const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
  function round0(n){ return Math.round(Number(n || 0)); }
  function money(n){ return '₹' + (Number(n||0).toFixed(2)); }

  /* Min profit floor used by the Floor button */
  const MIN_PROFIT = 100;
</script>

<style>
  #loyaltyPanel .nowrap { white-space: nowrap; }

  .sp-input{
    width: 6ch;
    max-width: 6ch;
    min-width: 6ch;
    text-align: right;
    padding: 2px 4px;
  }

  /* Apply is invisible but clickable */
  .disc-apply {
    background: transparent;
    border: none;
    color: transparent;
    opacity: 0;
    cursor: pointer;
    width: 40px;
    height: 24px;
  }
  .floor-btn {
    background: transparent;
    border: none;
    color: transparent;
    opacity: 0;
    cursor: pointer;
    width: 40px;
    height: 24px;
  }

  .sp-input::-webkit-outer-spin-button,
  .sp-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .sp-input[type=number] { -moz-appearance: textfield; }

  .disc-input{
    width: 4.5ch;
    max-width: 4.5ch;
    min-width: 4.5ch;
    text-align: right;
    padding: 2px 4px;
  }

  .orig-muted { opacity: .65; white-space: nowrap; }
  .disc-input::-webkit-outer-spin-button,
  .disc-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .disc-input[type=number] { -moz-appearance: textfield; }
</style>

<!-- Search modal -->
<div id="searchModal" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000;">
  <div style="background:#fff; margin:8vh auto; padding:12px; max-width:700px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <h3>Search Product</h3>
    <div class="row">
      <input id="sBrand" placeholder="brand contains..." class="grow" style="min-width:140px;">
      <select id="sCategory" style="min-width:140px;">
        <option value="">Any</option><option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
      </select>
      <input id="sSize" placeholder="size (optional)" style="width:140px;">
      <button id="sGo">Search</button>
      <button id="sClose">Close</button>
    </div>
    <div id="sResults" style="margin-top:10px; max-height:380px; overflow:auto; border:1px solid #eee;"></div>
  </div>
</div>

<!-- Cart table -->
<div class="table-responsive" style="margin-top:12px;">
  <table id="cartTable">
    <colgroup>
      <col style="width:16%;">
      <col style="width:16%;">
      <col style="width:10%;">
      <col style="width:10%;">
      <col style="width:12%;">
      <col style="width:18%;">  <!-- Price -->
      <col style="width:14%;">  <!-- Disc -->
      <col style="width:4%;">   <!-- (kept for layout balance) -->
    </colgroup>
    <thead>
      <tr style="background:#f5f5f5;">
        <th style="text-align:left;">Brand</th>
        <th style="text-align:left;">Category</th>
        <th style="text-align:left;">Size</th>
        <th style="text-align:left;">Qty</th>
        <th style="text-align:right;">MRP</th>
        <th style="text-align:right;">Price</th>
        <th style="text-align:center;">Disc</th>
        <th style="text-align:right;"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Totals + discount -->
<div class="row" style="margin-top:10px;">
  <input id="discount" class="input-sm" autocomplete="off" inputmode="numeric" pattern="\d{2}" maxlength="2" title="Enter a 2-digit number (10–99)" style="width:2.5em; max-width:40px; text-align:center; padding:6px;">
  <button id="applyDiscount"
        style="background:#2196f3;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Discount
  </button>

  <strong id="totalLbl">Total: ₹0.00</strong>
  <strong id="finalLbl">Final: ₹0.00</strong>

  <button id="btnProceed"
        style="background:#4caf50;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Proceed
  </button>

  <button id="btnAndroidPrint"
        style="background:#795548;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;opacity:0.6;cursor:not-allowed;"
        disabled>
    Print
  </button>

  <button id="btnClear"
        style="background:#e53935;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;">
    Clear
  </button>
</div>
<!-- Loyalty panel -->
<div id="loyaltyPanel" class="row" style="margin-top:10px; align-items:center; gap:10px; display:flex;">
  
  <span id="lpAvail" title="Available points">Available: 0</span>
  <span id="lpEarnPreview" title="Estimated points you’ll earn on this bill">(Earn: 0)</span>

  <input id="lpRedeem"
       type="text"
       inputmode="numeric"
       pattern="\d*"
       maxlength="3"
       style="width:3.5ch; text-align:right; padding:4px;">


  <button id="lpApply"  type="button"
          style="background:#00695c;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;">
    Apply
  </button>
  
</div>


<!-- Invoice preview -->
<h3 style="margin-top:12px;">Invoice Preview</h3>
<pre id="invoicePreview" style="background:#fff;"></pre>

<script>
/* =========
   Tiny helpers
   ========= */
function round0(n){ return Math.round(Number(n || 0)); }
function money(n){ return '₹' + (Number(n||0).toFixed(2)); }

/* =========================
   Scanner deep link wiring
   ========================= */
function buildCallback() {
  const url = new URL(window.location.href);
  url.searchParams.delete('code');
  return url.toString();
}
function openScanner() {
  const cb = encodeURIComponent(buildCallback());
  const deeplink = `dripscan://scan?callback=${cb}`;
  window.location.href = deeplink;
  setTimeout(() => { /* optional fallback */ }, 1500);
}
document.getElementById('btnScan').addEventListener('click', (e) => {
  e.preventDefault();
  openScanner();
});

/* ===============
   Manual toggles
   =============== */
document.getElementById('btnToggleManual').addEventListener('click', (e)=>{
  e.preventDefault();
  const box = document.getElementById('manualBox');
  box.style.display = (box.style.display === 'none' || !box.style.display) ? 'block' : 'none';
});
const mSize = document.getElementById('mSize');
const mCategory = document.getElementById('mCategory');
function refreshSizes() {
  const c = mCategory.value;
  const sizes = (c === 'Shirt' || c === 'T-Shirt') ? ['S','M','L','XL','XXL','3XL','4XL'] : ['28','30','32','34','36','38','40','42','44'];
  mSize.innerHTML = sizes.map(s=>`<option>${s}</option>`).join('');
}
mCategory.addEventListener('change', refreshSizes);
refreshSizes();

/* =========
   State
   ========= */

let cart = [];
let subtotal = 0, finalTotal = 0;
// Preview/save state
let appliedDiscount = "";  // "NN" numeric string (no %)
let lastPayload = null;    // built on Proceed (preview only)
let lastInvoiceId = null;  // set only after SAVE (Android print)
let lastInvoiceText = "";  // preview text
// persistence
const KEY_CART  = "drip_cart_v1";
const KEY_DISC  = "[REDACTED_GENERIC_API_KEY_1]";
const KEY_NAME  = "drip_name_v1";
const KEY_PHONE = "drip_phone_v1";
// Loyalty state
let lpAvailable = 0;   // fetched from backend
let lpCap       = 100; // fetched from backend; default 100
let lpRate      = 2;   // points per ₹100; backend can override
let lpRedeem    = 0;   // user-applied this bill

function lpClampRedeem(raw) {
  const n = Math.max(0, Math.floor(Number(raw || 0)));
  return Math.min(n, lpAvailable, lpCap);
}

function lpEstimatedEarn(finalAmt) {
  // mirror backend rule: floor(final / 100) * lpRate
  const base = Math.max(0, Math.floor(Number(finalAmt || 0)));
  return Math.floor(base / 100) * lpRate;
}

function lpRefreshUI() {
  document.getElementById('lpAvail').textContent = `Available: ${lpAvailable}`;
  const earn = lpEstimatedEarn(finalTotal);
document.getElementById('lpEarnPreview').textContent = `(Earn ₹${earn})`;
  document.getElementById('lpRedeem').value = lpRedeem ? String(lpRedeem) : '';

}
async function fetchAndSetLoyalty(phone){
  try {
    const r = await fetch(`/api/loyalty_points?phone=${encodeURIComponent(phone)}`);
    const j = await r.json();
    if (j && j.ok) {
      lpAvailable = Number(j.points || 0);
      lpCap       = Number(j.cap || 100);
      lpRate      = Number(j.rate_per_100 || lpRate);
    } else {
      lpAvailable = 0;
    }
  } catch {
    lpAvailable = 0;
  }
  // After updating loyalty, refresh totals + UI
  recalc();
  lpRefreshUI();
}


function persistState() {
  try {
    localStorage.setItem(KEY_CART, JSON.stringify(cart));
    localStorage.setItem(KEY_DISC, appliedDiscount || "");
    localStorage.setItem(KEY_NAME, (document.getElementById('custName').value || 'Guest').trim() || 'Guest');
    localStorage.setItem(KEY_PHONE, (document.getElementById('custPhone').value || '').trim());
  } catch {}
}
function restoreState() {
  try {
    const savedCart = localStorage.getItem(KEY_CART);
    if (savedCart) {
      const arr = JSON.parse(savedCart);
      if (Array.isArray(arr)) cart = arr;
    }
    const savedDisc = localStorage.getItem(KEY_DISC) || "";
    appliedDiscount = savedDisc;
    if (savedDisc) document.getElementById('discount').value = savedDisc;
    const nm = localStorage.getItem(KEY_NAME);
    const ph = localStorage.getItem(KEY_PHONE);
    if (nm) document.getElementById('custName').value = nm;
    if (ph) document.getElementById('custPhone').value = ph;
  } catch {}
}

/* =========
   Helpers
   ========= */
function sameKey(a,b){
  // If either has a barcode, require same code. Different codes must not merge.
  if ((a.code || b.code) && a.code !== b.code) return false;
  return a.brand===b.brand && a.category===b.category && a.size===b.size && Number(a.price)==Number(b.price);
}
function upsertCartItem(newItem){
  const i = cart.findIndex(it => sameKey(it, newItem));
  if (i >= 0) {
    cart[i].qty = Number(cart[i].qty) + Number(newItem.qty||1);
    if (!cart[i].code && newItem.code) cart[i].code = newItem.code; // keep code if present
  } else {
    cart.push(newItem);
  }
  renderCart();
}
function setPrintEnabled(on){
  const btn = document.getElementById('btnPrint');
  if (!btn) return;
  btn.style.pointerEvents = on ? 'auto' : 'none';
  btn.style.opacity = on ? '1' : '.5';
}
function setAndroidPrintReady(on){
  const btn = document.getElementById('btnAndroidPrint');
  btn.disabled = !on;
}
function invalidateCheckout() {
  lastInvoiceId = null;
  lastPayload   = null;
  lastInvoiceText = "";
  setPrintEnabled(false);
  setAndroidPrintReady(false);
  const btn = document.getElementById('btnProceed');
  btn.disabled = false;
  btn.textContent = 'Proceed';
}

function globalPct(){
  const raw = (appliedDiscount || '').trim();
  if (!raw) return 0;
  const v = parseFloat(raw);
  return isNaN(v) ? 0 : Math.max(0, v);
}

/* =========
   Totals
   ========= */
function recalc() {
  let gPct = globalPct();

  let subtotalBase = 0;        // base SP * qty (shown as "Total")
  let subtotalAfterRows = 0;   // after applying per-row discounts
  let eligibleForGlobal = 0;   // only rows with no per-row discount
  let boughtTotal = 0;         // guard baseline

  for (const it of cart) {
    const qty        = Number(it.qty || 0);
    const unitSell   = Number(it.price || 0);
    const unitBought = Number(it.bought_price || 0);
    const rowPct     = Number(it.disc_pct || 0);

    subtotalBase += unitSell * qty;
    boughtTotal  += unitBought * qty;

    let unitAfterRows = unitSell;
    if (rowPct > 0) {
      unitAfterRows = unitSell * (1 - rowPct/100);
    } else {
      eligibleForGlobal += unitSell * qty;
    }

    subtotalAfterRows += unitAfterRows * qty;
  }

  // apply global to the eligible portion only
  let globalDiscAmt = 0;
  if (gPct > 0) {
    globalDiscAmt = eligibleForGlobal * (gPct/100);
  }

  const finalCandidate = subtotalAfterRows - globalDiscAmt;

  // Guard: do not allow below bought + 100 (drop ONLY global if violated)
  let finalTotalLocal = finalCandidate;
  if (finalCandidate < (boughtTotal + 100)) {
    globalDiscAmt = 0;
    finalTotalLocal = subtotalAfterRows;
  }

  finalTotal = Math.max(0, finalTotalLocal);

  subtotal   = subtotalBase;
  let finalBeforeRedeem = Math.max(0, finalTotalLocal);

  // Loyalty redemption is ₹-for-point; clamp by balance/cap and not below 0
  const maxRedeemThisBill = Math.min(lpAvailable, lpCap);
  const appliedRedeem = Math.min(lpRedeem, maxRedeemThisBill, Math.floor(finalBeforeRedeem));
  finalTotal = Math.max(0, finalBeforeRedeem - appliedRedeem);

  document.getElementById('totalLbl').textContent = 'Total: ' + money(subtotal);
  document.getElementById('finalLbl').textContent = 'Final: ' + money(finalTotal);

  // update earn preview
  lpRefreshUI();
}

/* =================
   Cart rendering
   ================= */
function renderCart() {
  const tb = document.querySelector('#cartTable tbody');
  tb.innerHTML = '';

  let gPct = globalPct();

  cart.forEach((it, idx) => {
    const base   = Number(it.price || 0);
    const rowPct = Number(it.disc_pct || 0);
    const effPct = rowPct > 0 ? rowPct : gPct;

    // Rounded display values
    const baseR  = round0(base);
    const afterR = effPct ? round0(base * (1 - effPct/100)) : baseR;

    const displayText = effPct ? `(${baseR})${afterR}` : `${baseR}`;

    const priceCell = IS_ADMIN
      ? `
        <div style="display:flex; gap:4px; justify-content:flex-end; align-items:center;">
          <span class="orig-muted">(${baseR})</span>
          <input class="sp-input" data-i="${idx}" type="number" min="0" step="1"
                 inputmode="numeric" pattern="\\d*" value="${afterR}">
        </div>`
      : `<span>${displayText}</span>`;

    const discCell =
  `<div style="display:flex; gap:6px; justify-content:center; align-items:center;">
     <input class="disc-input" data-i="${idx}" type="number" min="0" step="1"
            inputmode="numeric" pattern="\\d*" value="${(it.disc_pct ? Number(it.disc_pct) : '')}">
     <button type="button" class="disc-apply" data-i="${idx}">Apply</button>
     <button type="button" class="floor-btn"  data-i="${idx}" title="Set to bought+${MIN_PROFIT}">
       Floor
     </button>
   </div>`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${it.brand||''}</td>
      <td>${it.category||''}</td>
      <td>${it.size||''}</td>
      <td>
        <button type="button" data-act="minus" data-i="${idx}">-</button>
        <span style="display:inline-block; width:28px; text-align:center;">${it.qty}</span>
        <button type="button" data-act="plus" data-i="${idx}">+</button>
      </td>
      <td style="text-align:right;">${round0(it.mrp_price||0)}</td>
      <td style="text-align:right;">${priceCell}</td>
      <td style="text-align:center;">${discCell}</td>
      <td style="text-align:right;"></td>
    `;
    tb.appendChild(tr);
  });

  recalc();
  invalidateCheckout();
  persistState();
}

/* =================
   Floor price button (per-row)
   ================= */
document.querySelector('#cartTable').addEventListener('click', (e) => {
  const btn = e.target.closest('button.floor-btn');
  if (!btn) return;

  const i = +btn.dataset.i;
  if (Number.isNaN(i) || !cart[i]) return;

  const base   = Number(cart[i].price || 0);          // current base selling price (before discounts)
  const bought = Number(cart[i].bought_price || 0);
  const floor  = round0(bought + MIN_PROFIT);         // desired after-price

  if (base <= 0) { alert('Invalid base price'); return; }

  // If floor >= base, we cannot "discount up". In that case, clear discount (sell at base).
  if (floor >= round0(base)) {
    cart[i].disc_pct = 0;
    renderCart();
    return;
  }

  // Compute discount% so that after-price becomes exactly the floor price
  const pct = (1 - (floor / base)) * 100;
  cart[i].disc_pct = Math.round(pct * 100) / 100;   // keep 2 decimals
  renderCart();
});

/* =================
   Qty & remove controls
   ================= */
document.querySelector('#cartTable').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;

  e.preventDefault();
  e.stopPropagation();

  const act = btn.getAttribute('data-act');
  const i = +btn.getAttribute('data-i');
  if (Number.isNaN(i) || !cart[i]) return;

  if (act === 'minus') { cart[i].qty = Math.max(0, Number(cart[i].qty) - 1); if (cart[i].qty === 0) cart.splice(i, 1); renderCart(); }
  if (act === 'plus')  { cart[i].qty = Number(cart[i].qty) + 1; renderCart(); }
  if (act === 'remove'){ cart.splice(i, 1); renderCart(); }
});

/* =================
   Per-row discount (Apply button)
   ================= */
// Allowed discount codes (same as global)
const ALLOWED_CODES = new Set([0,10, 15, 20, 25, 30, 35]);

// Per-row "Apply" works like global Discount button
document.querySelector('#cartTable').addEventListener('click', (e) => {
  const btn = e.target.closest('button.disc-apply');
  if (!btn) return;

  const i = +btn.dataset.i;
  if (Number.isNaN(i) || !cart[i]) return;

  const input = document.querySelector(`input.disc-input[data-i="${i}"]`);
  let raw = (input?.value || '').trim();

  // Blank -> clear row discount and re-render
  if (raw === '') {
    cart[i].disc_pct = 0;   // logical zero in calc
    renderCart();           // will re-render the box to ""
    return;
  }

  // Accept "10" or "10%"
  if (raw.endsWith('%')) raw = raw.slice(0, -1);
  const pct = Number(raw);

  // Validate against allowed codes (exact match)
  if (!ALLOWED_CODES.has(pct)) {
    alert('Invalid Code');
    input.focus();
    input.select();
    return;
  }

  // Safety guard (same rule you use elsewhere)
  const unitSell   = Number(cart[i].price || 0);
  const unitBought = Number(cart[i].bought_price || 0);
  const unitAfter  = unitSell * (1 - pct / 100);

  if (unitAfter < (unitBought + 100)) {
    alert(`Maximum discount reached for ${cart[i].brand || 'item'} (${cart[i].category || ''} ${cart[i].size || ''}).`);
    return;
  }

  // ✅ Apply per-row discount (overrides any global)
  cart[i].disc_pct = pct;

  // Optional: normalize the input box to "NN"
  input.value = String(pct);

  renderCart();
});

/* =================
   Admin edits: after-price -> compute discount%
   ================= */
document.querySelector('#cartTable').addEventListener('change', (e)=>{
  if (!e.target.classList.contains('sp-input')) return;

  const i = +e.target.getAttribute('data-i');
  if (isNaN(i) || !cart[i]) return;

  const base   = Number(cart[i].price || 0);          // immutable base SP
  const bought = Number(cart[i].bought_price || 0);
  const raw    = parseFloat(e.target.value);
  const afterInput = round0(isNaN(raw) ? 0 : raw);     // round to whole
  e.target.value = afterInput;                         // reflect rounding

  // current effective after for revert
  const currentPct   = Number(cart[i].disc_pct || 0);
  const currentAfter = currentPct > 0 ? round0(base * (1 - currentPct/100)) : round0(base);

  if (afterInput <= 0) {
    e.target.value = currentAfter;
    return;
  }

  // No discount if admin sets >= base
  if (afterInput >= round0(base)) {
    cart[i].disc_pct = 0;
    e.target.value = round0(base);
    renderCart();
    return;
  }

  // Guard
  if (afterInput < (round0(bought) + 100)) {
    alert(`Maximum discount reached for ${cart[i].brand || 'item'} (${cart[i].category || ''} ${cart[i].size || ''}).`);
    e.target.value = currentAfter;
    return;
  }

  // compute % from base → after
  const pct = (1 - (afterInput / base)) * 100;
  cart[i].disc_pct = Math.round(pct * 100) / 100;  // keep 2 decimals for % value
  renderCart();
});

/* =================
   keep per-row % input tidy
   ================= */
document.querySelector('#cartTable').addEventListener('change', (e)=>{
  if (!e.target.classList.contains('disc-input')) return;
  const i = +e.target.getAttribute('data-i');
  if (isNaN(i) || !cart[i]) return;

  const raw = (e.target.value ?? '').trim();
  if (raw === '') {
    // leave it blank; don't overwrite with 0
    return;
  }

  let v = parseFloat(raw);
  if (isNaN(v) || v < 0) v = 0;
  e.target.value = String(v);
});

/* =================
   Global Discount button
   ================= */
document.getElementById('applyDiscount').addEventListener('click', ()=>{
  let raw = (document.getElementById('discount').value || '').trim();

  // clear global discount
  if (!raw){
    appliedDiscount = "";
    renderCart();
    invalidateCheckout();
    persistState();
    return;
  }

  // allow "10" or "10%" in the box, persist only "10"
  let pct = raw.endsWith('%') ? parseFloat(raw.slice(0,-1)) : parseFloat(raw);
  const ALLOWED = new Set([10,15,20,25,30,35]);
  if (isNaN(pct) || !ALLOWED.has(pct)) { alert('Invalid Code'); return; }

  // Guard for all rows (respecting row overrides)
  for (const it of cart) {
    const rowPct = Number(it.disc_pct||0);
    const usePct = rowPct > 0 ? rowPct : pct;
    const unitSell   = Number(it.price || 0);
    const unitBought = Number(it.bought_price || 0);
    const unitAfter  = unitSell * (1 - usePct/100);
    if (usePct > 0 && unitAfter < (unitBought + 100)) {
      alert(`Maximum discount reached for ${it.brand || 'item'} (${it.category || ''} ${it.size || ''}).`);
      return;
    }
  }

  // ✅ store/display numeric only (no %)
  appliedDiscount = String(pct);
  document.getElementById('discount').value = String(pct);

  renderCart();
  invalidateCheckout();
  persistState();
});

/* =================
   Barcode handlers
   ================= */
async function addBarcode() {
  const code = document.getElementById('barcode').value.trim();
  document.getElementById('barcode').value = '';
  if (!code) return;
  try {
    const r = await fetch('{{ url_for("api_barcode_lookup") }}', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ barcode: String(code).trim() })
    });
    const j = await r.json();
    if (!j.ok) { alert('Barcode not found'); return; }
    // coerce prices to whole numbers
    const item = {
      ...j.item,
      mrp_price: round0(j.item.mrp_price),
      price:     round0(j.item.price),
      bought_price: Number(j.item.bought_price || 0),
      qty: Number(j.item.qty || 1),
      disc_pct: undefined
    };
    upsertCartItem(item);
  } catch { alert('Network error'); }
}
document.getElementById('barcode').addEventListener('keydown', e => { if (e.key==='Enter') addBarcode(); });
document.getElementById('btnBarcode').addEventListener('click', addBarcode);

  document.getElementById('mBrand').value = ''; document.getElementById('mPrice').value = ''; document.getElementById('mQty').value = 1;
});

document.getElementById('sGo').addEventListener('click', async ()=>{
  const brand = document.getElementById('sBrand').value.trim();
  const category = document.getElementById('sCategory').value;
  const size = document.getElementById('sSize').value.trim();
  const r = await fetch('{{ url_for("api_search_products") }}', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({brand, category, size, limit: 50})
  });
  const j = await r.json(); const box = document.getElementById('sResults'); box.innerHTML='';
  if (!j.ok || !j.results.length) { box.textContent='No results'; return; }
  j.results.forEach((it)=>{
    const mrpR = round0(it.mrp_price||0), priceR = round0(it.price||0);
    const row = document.createElement('div'); row.style.borderBottom='1px solid #eee'; row.style.padding='6px';
    row.innerHTML = `<strong>${it.brand}</strong> — ${it.category}, ${it.size} | MRP: ${mrpR} | Price: ${priceR} <button>Add</button>`;
    row.querySelector('button').addEventListener('click', ()=> 
      upsertCartItem({...it, qty:1, disc_pct: undefined, mrp_price: mrpR, price: priceR})
    );
    box.appendChild(row);
  });
});

document.getElementById('custPhone').addEventListener('input', async (e)=>{
  const ph = e.target.value.replace(/\D/g,'').slice(0,10);
  e.target.value = ph;

  if (ph.length === 10) {
    // last name autofill
    try {
      const r = await fetch(`{{ url_for("api_customer_last_name") }}?phone=${ph}`);
      const j = await r.json();
      if (j.ok && j.name) document.getElementById('custName').value = j.name;
    } catch {}

    // loyalty
    lpRedeem = 0;           // fresh bill => clear any previous redeem entry
    await fetchAndSetLoyalty(ph);
  }

  invalidateCheckout();
  persistState();
});

/* ==========================
   Proceed / Print / Clear
   ========================== */
const proceedBtn = document.getElementById('btnProceed');
proceedBtn.addEventListener('click', async ()=>{
  if (proceedBtn.disabled) return;
  const name = (document.getElementById('custName').value || 'Guest').trim() || 'Guest';
  const phone = (document.getElementById('custPhone').value || '').trim();
  if (!/^\d{10}$/.test(phone)) { alert('Enter valid 10-digit phone'); return; }
  if (!cart.length) { alert('Cart is empty'); return; }
  proceedBtn.disabled = true; const oldTxt = proceedBtn.textContent; proceedBtn.textContent = 'Preparing...';
  try {
    lastPayload = {
      customer_name: name,
      phone,
      items: cart.map(i => ({
        code: (i.code || ""),
        brand: i.brand, category: i.category, size: i.size,
        qty: Number(i.qty||0),
        mrp_price: round0(i.mrp_price||0),     // rounded outbound
        bought_price: Number(i.bought_price||0),
        price: round0(i.price||0),             // rounded outbound
        disc_pct: Number(i.disc_pct||0)
      })),
      // If your backend expects "10%" instead of "10", use:
      // discount: appliedDiscount ? `${appliedDiscount}%` : "",
      discount: appliedDiscount,
      redeem_points: Number(lpRedeem || 0),
      preview: true // do NOT save
    };
    const res = await fetch('{{ url_for("api_checkout") }}', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(lastPayload)
    });
    const j = await res.json();
    if (!j.ok) { alert(j.error || 'Preview failed'); proceedBtn.disabled = false; proceedBtn.textContent = oldTxt; return; }
    lastInvoiceId = null;
    lastInvoiceText = j.invoice_text || '';
    document.getElementById('invoicePreview').textContent = lastInvoiceText;
    setPrintEnabled(true);
    setAndroidPrintReady(true);
    proceedBtn.textContent = 'Ready to Print';
  } catch {
    alert('Network error'); proceedBtn.disabled = false; proceedBtn.textContent = oldTxt;
  }
});

// Exact-format SMS text
function buildSmsText(name, amt, earned = 0) {
  return (
    `Hi ${name},\n\n` +
    `Your bill is Rs ${amt}.\n` +
    (earned > 0 ? `Earned Rs ${earned}\n\n` : `\n`) +
    `Follow us on:\n` +
    `WhatsApp: https://t.ly/hcWjm\n` +
    `Insta: https://t.ly/CGh_x\n\n` +
    `Thanks for shopping with DRIP Fashions!`
  );
}




document.getElementById('btnAndroidPrint').addEventListener('click', async (e)=>{
  e.preventDefault();
  if (!lastPayload) { alert('Please click Proceed first.'); return; }

  // Save, but ask server to persist async for speed
  const toSave = { ...lastPayload, preview: false, async: true };

  const btn = e.currentTarget;
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await fetch('{{ url_for("api_checkout") }}', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(toSave),
      credentials: 'same-origin'
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Save failed');

    // Server returns the real ID used for print + DB row
    lastInvoiceId = j.invoice_id;
    document.getElementById('invoicePreview').textContent = j.invoice_text || lastInvoiceText || '';

    const base  = window.location.origin;

    // Build SMS payload (exact format)
    const name  = (document.getElementById('custName').value || 'Guest').trim() || 'Guest';
    const phone = (document.getElementById('custPhone').value || '').trim(); // 10-digit
    const amt   = Math.max(0, Math.round(Number(finalTotal ?? 0)));
    const earned = lpEstimatedEarn(finalTotal);
      // pass earned directly; no extra addendum needed
      const smsText = buildSmsText(name, amt, earned);


    // 1) Custom-scheme deep link (app prints + sends SMS)
    const schemeUrl =
      `drip://receipt?base=${encodeURIComponent(base)}&code=${encodeURIComponent(lastInvoiceId)}` +
      `&sms_to=${encodeURIComponent(phone)}&sms_text=${encodeURIComponent(smsText)}`;

    // 2) Chrome intent fallback
    const intentUrl =
      `intent://receipt?base=${encodeURIComponent(base)}&code=${encodeURIComponent(lastInvoiceId)}` +
      `&sms_to=${encodeURIComponent(phone)}&sms_text=${encodeURIComponent(smsText)}` +
      `#Intent;scheme=drip;package=com.drip.tsplprint;S.browser_fallback_url=${encodeURIComponent(base + '/reprint/' + lastInvoiceId)};end`;

    // Fire custom scheme first (via synthetic <a> click)
    const a = document.createElement('a');
    a.href = schemeUrl;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

    // Then intent fallback
    setTimeout(() => {
      window.location.replace(intentUrl);
    }, 250);

    // Final web fallback (if app not installed / user cancels)
    setTimeout(() => {
      window.location.href = base + '/reprint/' + lastInvoiceId;
    }, 1500);

    btn.textContent = 'Sent to printer';
  } catch (err) {
    alert(err.message || 'Network error');
    btn.textContent = old;
    btn.disabled = false;
  }
});

document.getElementById('btnClear').addEventListener('click', ()=>{

  appliedDiscount = "";
  document.getElementById('discount').value = '';

  // reset Name & Phone
  const nameEl  = document.getElementById('custName');
  const phoneEl = document.getElementById('custPhone');
  nameEl.value  = 'Guest';
  phoneEl.value = '8106204688';

  // clear persisted values
  try {
    localStorage.removeItem(KEY_NAME);
    localStorage.removeItem(KEY_PHONE);
  } catch {}

  // clear cart and re-render
  cart = [];
  renderCart();

  // clear preview + flags
  document.getElementById('invoicePreview').textContent = '';
  lastInvoiceId = null; lastPayload = null; lastInvoiceText = "";
  setPrintEnabled(false);
  setAndroidPrintReady(false);
    // reset loyalty state
  lpAvailable = 0; lpRedeem = 0;
  lpRefreshUI();

});

/* =========
   Init
   ========= */
(function init(){
  restoreState();
  renderCart();

  // NEW: prefetch loyalty if the phone already looks valid
  const ph = (document.getElementById('custPhone').value || '').trim();
  if (/^\d{10}$/.test(ph)) {
    fetchAndSetLoyalty(ph);
  }

  // existing barcode deep-link handling...
  const params = new URLSearchParams(window.location.search);
  const code = (params.get('code') || '').trim();
  if (code) {
    document.getElementById('barcode').value = code;
    if (typeof addBarcode === 'function') addBarcode();
    params.delete('code');
    const clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', clean);
  }
})();
