<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login — DRIP Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; }
    .container { max-width: 420px; margin: 10vh auto; padding: 24px; }
    .card { border:1px solid #e5e7eb; border-radius:10px; padding:24px; box-shadow:0 4px 10px rgba(0,0,0,.06); }
    input, button { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #d1d5db; }
    button { background:#2563eb; color:#fff; border:none; font-weight:600; cursor:pointer; }
    .flash { padding:10px; margin:8px 0; border-radius:8px; }
    .danger { background:#fee2e2; color:#991b1b; }
    .success { background:#dcfce7; color:#166534; }
    .info { background:#e0f2fe; color:#075985; }
  </style>
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <div class="card">
      <h2 style="margin-top:0;">Sign in</h2>
      <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <label>Username</label>
        <input name="username" value="{{ username or '' }}" autocomplete="username" required>
        <label>Password</label>
        <input name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
