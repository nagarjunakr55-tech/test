{% extends "base.html" %}
{% block content %}
<h2>Barcode Generator</h2>

<style>
  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr; /* brand bigger */
    gap: 8px; max-width: 960px;
  }
  .form-row { margin-bottom: 10px; }
  .form-grid input, .form-grid select {
    width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 16px;
  }
  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .brand { grid-column: 1 / span 2; } /* brand full width on mobile */
  }
</style>

<form method="post" action="{{ url_for('labels.create') }}">
  <div class="form-row form-grid">
    <input id="brand" class="brand" name="brand" placeholder="Brand" required
           tabindex="1" enterkeyhint="next" autocomplete="off" />

    <input id="mrp" name="mrp" placeholder="MRP"
           type="text" inputmode="decimal" pattern="[0-9]*"
           tabindex="2" enterkeyhint="next" autocomplete="off" />

    <input id="bought" name="bought" placeholder="Bought"
           type="text" inputmode="decimal" pattern="[0-9]*"
           tabindex="3" enterkeyhint="next" autocomplete="off" />

    <input id="sp" name="sp" placeholder="SP Price"
           type="text" inputmode="decimal" pattern="[0-9]*"
           tabindex="4" enterkeyhint="next" autocomplete="off" />

    <select id="size" name="size" required tabindex="5" enterkeyhint="next">
      <option value="">Size…</option>
      <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
      <option>28</option><option>30</option><option>32</option><option>34</option>
      <option>36</option><option>38</option><option>40</option><option>42</option>
    </select>

    <select id="category" name="category" required tabindex="6" enterkeyhint="next">
      <option value="">Category…</option>
      <option>Shirt</option><option>Pant</option><option>Short</option><option>T-Shirt</option>
    </select>
  </div>

  <div class="form-row" style="display:flex; align-items:center; gap:12px; max-width:420px;">
    <label for="copies">How many:</label>
    <input id="copies" name="copies" value="1" min="1"
           type="number" inputmode="numeric" tabindex="7" enterkeyhint="done" style="width:120px;" />
  </div>

  <div class="form-row" style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="btn" type="submit" tabindex="8">Print Barcode</button>
    <a class="btn" href="{{ url_for('billing') }}">Back</a>
  </div>
</form>

<script>
(function() {
  const order = ["brand","mrp","bought","sp","size","category","copies"];
  function focusNext(id) {
    const idx = order.indexOf(id);
    const nextId = idx >= 0 && idx < order.length - 1 ? order[idx+1] : null;
    if (nextId) document.getElementById(nextId)?.focus();
  }
  function handleEnterAdvance(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      focusNext(e.target.id);
    }
  }
  order.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === "INPUT") {
      el.addEventListener("keydown", handleEnterAdvance);
    } else if (el.tagName === "SELECT") {
      el.addEventListener("keydown", handleEnterAdvance);
      el.addEventListener("change", () => focusNext(id));
    }
  });
})();
</script>
{% endblock %}
