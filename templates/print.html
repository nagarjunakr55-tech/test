{% extends "base.html" %}
{% set body_class = "is-print" %}
{% block content %}
<style>
  /* Screen preview: show exact label width centered */
  @media screen {
    .preview { width: {{ label_mm|default(80) }}mm; margin: 0 auto; border: 1px dashed #ddd; }
    .preview pre { font-size: 18px; line-height: 1.3; }
  }
  /* Print: force exact width, zero margins */
  @media print {
    @page { size: {{ label_mm|default(80) }}mm auto; margin: 0; }
    body.is-print, body.is-print .container, .preview {
      width: {{ label_mm|default(80) }}mm !important; margin: 0 !important; padding: 0 !important;
    }
    .preview pre {
      margin: 0; padding: 0;
      white-space: pre; font-size: 12px; line-height: 1.2; border: 0;
    }
  }
</style>

<div class="preview">
  <pre>{{ invoice }}</pre>
</div>

<script>
  function goBack() {
    const params = new URLSearchParams(location.search);
    const ret = params.get('ret');
    if (window.opener) {
      // opened by JS → safe to close
      window.close();
    } else if (ret) {
      location.href = ret;
    }
  }

  addEventListener('load', () => {
    // open system dialog
    window.print();

    // Best-effort auto return after printing
    addEventListener('afterprint', goBack);

    // Android/Chrome fallback: if tab gets hidden after print, return soon
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        setTimeout(goBack, 600);
      }
    });

    // Last resort fallback timer (in case afterprint isn’t fired)
    setTimeout(goBack, 4000);
  });
</script>
{% endblock %}
